<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="I Miei Turni">
<meta name="description" content="I turni mensili del Pronto Soccorso di DEA e OSG: cerca un nome, evidenzialo nei giorni, controlla le segnalazioni.">
<title>I Miei Turni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ==========================================================================
   I Miei Turni — foglio di stile unico, mobile first.
   Una sola colonna: intestazione fissa, elenco dei nomi, schede dei giorni,
   segnalazioni, dati. Tutti i colori passano dai token in :root.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Token — tema chiaro (carta, tendenza fredda)
   -------------------------------------------------------------------------- */
:root {
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --ink: #151B22;
  --ink-2: #4A5563;
  --muted: #7B8594;
  --line: #E2E5EA;
  --line-strong: #C9CED6;

  --night: #EDEFF3;
  --night-veil: rgba(24, 38, 62, .045);   /* la notte vela il fondo, anche nel weekend */
  --weekend: #FAF6EC;

  --hl: #FFE45C;
  --hl-ink: #1A1500;
  --hl-soft: #FFF4A8;
  --hl-soft-ink: #1A1500;
  --hl-ring: #E8C400;

  --dea: #0F8A7E;
  --dea-tint: #E4F4F1;
  --osg: #9B3B8E;
  --osg-tint: #F5E7F3;
  --alt: #64707E;
  --alt-tint: #ECEEF1;

  --sev3: #D1343B;
  --sev2: #E07B12;
  --sev1: #3B6FD9;
  --ok: #2E8B57;

  --focus: #2F6FE4;
  --shadow: 0 10px 30px rgba(16, 22, 30, .14), 0 2px 6px rgba(16, 22, 30, .07);
  --scrim: rgba(20, 26, 34, .55);

  --ui: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;

  --fs: 14px;
  --pad: 12px;
  --labelw: 84px;
  --h-header: 104px;   /* aggiornato da app.js con l'altezza reale */
  --tpl: var(--labelw) 1fr 1fr;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1216;
    --surface: #161B21;
    --surface-2: #1C222A;
    --ink: #E9EDF2;
    --ink-2: #B4BCC7;
    --muted: #8B95A3;
    --line: #262D36;
    --line-strong: #3A434F;

    --night: #111519;
    --night-veil: rgba(150, 180, 220, .05);
    --weekend: #191711;

    --hl: #F2D53C;
    --hl-ink: #1A1500;
    --hl-soft: #5C5117;
    --hl-soft-ink: #FFF0A0;
    --hl-ring: #C8AE1E;

    --dea: #3FBFB0;
    --dea-tint: #123430;
    --osg: #C86BB8;
    --osg-tint: #3A1E36;
    --alt: #94A0AE;
    --alt-tint: #232A33;

    --sev3: #F0616A;
    --sev2: #F0A03A;
    --sev1: #6E9BF0;
    --ok: #5BC98A;

    --focus: #6E9BF0;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
    --scrim: rgba(4, 7, 10, .6);
  }
}

:root[data-theme="dark"] {
  --bg: #0E1216;
  --surface: #161B21;
  --surface-2: #1C222A;
  --ink: #E9EDF2;
  --ink-2: #B4BCC7;
  --muted: #8B95A3;
  --line: #262D36;
  --line-strong: #3A434F;

  --night: #111519;
  --night-veil: rgba(150, 180, 220, .05);
  --weekend: #191711;

  --hl: #F2D53C;
  --hl-ink: #1A1500;
  --hl-soft: #5C5117;
  --hl-soft-ink: #FFF0A0;
  --hl-ring: #C8AE1E;

  --dea: #3FBFB0;
  --dea-tint: #123430;
  --osg: #C86BB8;
  --osg-tint: #3A1E36;
  --alt: #94A0AE;
  --alt-tint: #232A33;

  --sev3: #F0616A;
  --sev2: #F0A03A;
  --sev1: #6E9BF0;
  --ok: #5BC98A;

  --focus: #6E9BF0;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
  --scrim: rgba(4, 7, 10, .6);
}

/* --------------------------------------------------------------------------
   2. Base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

/* Un elemento nascosto resta nascosto anche se una classe gli dà un display. */
[hidden] { display: none !important; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs)/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .92em; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 3px;
}

.sprite { display: none; }
.ico { width: 16px; height: 16px; flex: none; display: block; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

.filein {
  position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  left: 0; top: 0;
}

.skiplink {
  position: absolute; left: 8px; top: -60px; z-index: 90;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 8px 12px; text-decoration: none;
  transition: top .12s ease;
}
.skiplink:focus { top: 8px; }

/* --------------------------------------------------------------------------
   3. Intestazione fissa
   -------------------------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}

.topbar__in {
  max-width: 640px;
  margin: 0 auto;
  padding: 7px var(--pad) 9px;
  display: flex; flex-direction: column; gap: 8px;
}

.toprow { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.toprow__end { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.wordmark {
  font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.1;
  color: var(--ink-2); letter-spacing: .01em; white-space: nowrap;
  min-width: 0; overflow: hidden; text-overflow: ellipsis;   /* mai oltre il bordo */
}

.month { display: flex; align-items: center; min-width: 0; }
.month__t {
  font-family: var(--display); font-size: 21px; line-height: 1.1; color: var(--ink);
  white-space: nowrap;
}
.month__sel {
  position: relative; display: inline-flex; align-items: center; gap: 3px;
  border-radius: 6px; padding: 2px 2px 2px 4px;
}
.month__sel:hover { background: var(--surface-2); }
.month__sel select {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; border: 0; padding: 0; margin: 0; -webkit-appearance: none; appearance: none;
}
.month__sel .ico { width: 14px; height: 14px; color: var(--muted); }
.month__sel:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

.pillbtn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 0 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 16px; cursor: pointer;
  font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
.pillbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.pillbtn:active, .ghostbtn:active, .btn:active, .minibtn:active, .fitem:active { transform: scale(.97); }
.pillbtn, .ghostbtn, .btn, .minibtn, .fitem { transition: transform .08s ease, background-color .15s ease, border-color .15s ease; }
.pillbtn .ico { width: 15px; height: 15px; color: var(--ok); }
.sevdot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sevdot.sev-3 { background: var(--sev3); }
.sevdot.sev-2 { background: var(--sev2); }
.sevdot.sev-1 { background: var(--sev1); }

.ghostbtn {
  min-height: 32px; padding: 0 10px;
  background: none; border: 1px solid var(--line); border-radius: 16px;
  color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer;
}
.ghostbtn:hover { border-color: var(--line-strong); color: var(--ink); }

/* Campo di ricerca — il controllo principale della pagina */
.search {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 0 8px 0 12px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: 10px;
}
.search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.search__ico { width: 19px; height: 19px; color: var(--hl-ring); }
.search__body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.search__input {
  flex: 1; min-width: 40px; width: 100%;
  border: 0; background: none; outline: none; padding: 0;
  font: 400 16px/1.3 var(--ui); color: var(--ink);
}
.search__input::placeholder { color: var(--muted); }
.search__input:focus-visible { outline: none; }

.pintoken {
  display: inline-flex; align-items: center; gap: 2px;
  max-width: 62%; padding: 3px 3px 3px 7px;
  background: var(--hl); color: var(--hl-ink); border-radius: 4px;
  font-size: 14px; font-weight: 600; letter-spacing: .01em;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
.pintoken__n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pintoken button {
  display: grid; place-items: center; width: 24px; height: 24px;
  background: none; border: 0; border-radius: 4px; cursor: pointer; color: var(--hl-ink);
}
.pintoken button:hover { background: rgba(0, 0, 0, .12); }

.iconbtn {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  background: none; border: 0; border-radius: 8px; cursor: pointer; color: var(--muted);
}
.iconbtn:hover { background: var(--surface); color: var(--ink); }

/* --------------------------------------------------------------------------
   4. Elenco dei candidati (foglio sotto il campo)
   -------------------------------------------------------------------------- */
.pop {
  position: absolute; top: calc(100% + 6px); left: -1px; right: -1px; z-index: 50;
  max-height: 50vh; overflow-y: auto; overscroll-behavior-y: none;
  background: var(--surface);
  border: 0; border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 4px;
}
.opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 42px; padding: 6px 8px;
  background: none; border: 0; border-radius: 7px; cursor: pointer; text-align: left;
}
.opt + .opt { border-top: 1px solid var(--line); }
.opt.is-armed { background: var(--hl-soft); color: var(--hl-soft-ink); box-shadow: inset 0 0 0 1px var(--hl-ring); border-top-color: transparent; }
.opt__main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.opt__name { font-size: 14px; font-weight: 500; letter-spacing: .01em; overflow-wrap: break-word; }
.opt__name b { font-weight: 600; box-shadow: inset 0 -.55em 0 var(--hl-soft); }
.opt.is-armed .opt__name b { box-shadow: none; text-decoration: underline; text-underline-offset: 2px; }
.opt__why { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--sev2); }
.opt__why .ico { width: 12px; height: 12px; }
.opt__n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt__dots { display: flex; gap: 3px; }
.opt__empty { padding: 12px 10px; color: var(--muted); font-size: 13.5px; }

.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--alt); flex: none; }
.h-dea .dot, .dot.h-dea { background: var(--dea); }
.h-osg .dot, .dot.h-osg { background: var(--osg); }

/* --------------------------------------------------------------------------
   5. Impaginato generale
   -------------------------------------------------------------------------- */
.page {
  max-width: 640px; margin: 0 auto;
  padding: 12px var(--pad) calc(40px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.stitle {
  font-family: var(--display); font-size: 19px; line-height: 1.15; color: var(--ink);
}

.cap { font-size: 12px; color: var(--muted); }

/* --------------------------------------------------------------------------
   6. Striscia dei nomi / scheda della persona
   -------------------------------------------------------------------------- */
.strip { padding: 12px; }
.strip__head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.strip__cap { margin-bottom: 10px; }
.strip__names {
  display: flex; flex-wrap: wrap; gap: 6px;
  overflow: hidden;
}
.strip__names.is-clamped { max-height: 128px; }
.strip__more {
  margin-top: 8px; width: 100%; min-height: 40px;
  background: none; border: 0; border-radius: 8px;
  color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer;
}
.strip__more:hover { background: var(--surface-2); color: var(--ink); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
  min-height: 38px; padding: 5px 9px;
  background: var(--surface-2); border: 0; border-radius: 6px;
  cursor: pointer; text-align: left;
  font-size: 13px; font-weight: 500; letter-spacing: .01em; color: var(--ink);
  transition: background-color .15s ease, color .15s ease, transform .08s ease;
}
.chip:hover { background: var(--line); }
.chip:active { transform: scale(.97); }
.chip__n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip__dots { display: flex; gap: 3px; }
.chip__why {
  display: flex; align-items: center; gap: 3px;
  width: 100%; font-size: 11px; font-weight: 400; color: var(--sev2);
}
.chip__why .ico { width: 12px; height: 12px; }
.chip.is-warn { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sev2) 32%, transparent); }
.chip.is-soft { background: var(--hl-soft); color: var(--hl-soft-ink); }
.chip.is-strong { background: var(--hl); color: var(--hl-ink); }

/* Scheda */
.scheda { display: flex; flex-direction: column; gap: 10px; }
.scheda__top { display: flex; align-items: flex-start; gap: 10px; }
.scheda__label { font-family: var(--display); font-size: 15px; color: var(--muted); }
.scheda__name {
  display: inline-block; margin-top: 2px; padding: 2px 6px;
  background: var(--hl); color: var(--hl-ink); border-radius: 4px;
  font-size: 19px; font-weight: 600; letter-spacing: .01em; overflow-wrap: break-word;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
.scheda__stats { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scheda__stats b { font-weight: 500; }
.scheda__unpin {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  min-height: 40px; padding: 0 10px 0 6px;
  background: none; border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink-2); font-size: 13px; cursor: pointer;
}
.scheda__unpin:hover { border-color: var(--line-strong); color: var(--ink); }

/* Mini-mese */
.mm { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.mm__d {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  aspect-ratio: 1 / 1; padding: 2px 0 3px;
  /* I giorni liberi restano senza bordo: in evidenza solo quelli lavorati. */
  border: 1px solid transparent; border-radius: 6px; background: var(--surface-2);
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
button.mm__d { cursor: pointer; color: var(--ink); transition: transform .08s ease; }
button.mm__d:active { transform: scale(.94); }
button.mm__d:hover { border-color: var(--line-strong); }
.mm__d.is-weekend { color: var(--ink-2); font-weight: 500; }
.mm__d.on-dea { background: var(--dea-tint); border-color: color-mix(in srgb, var(--dea) 45%, var(--line)); color: var(--ink); font-weight: 500; }
.mm__d.on-osg { background: var(--osg-tint); border-color: color-mix(in srgb, var(--osg) 45%, var(--line)); color: var(--ink); font-weight: 500; }
.mm__d.on-dea.on-osg { background: linear-gradient(135deg, var(--dea-tint) 0 50%, var(--osg-tint) 50% 100%); }
.mm__d.is-today { box-shadow: 0 0 0 2px var(--hl-ring); }
.mm__marks { display: flex; align-items: center; gap: 2px; height: 6px; }
.mm__marks .dot { width: 5px; height: 5px; }
.mm__marks .ico { width: 7px; height: 7px; color: var(--ink-2); }

.mm__legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); }
.mm__legend span { display: inline-flex; align-items: center; gap: 4px; }

/* Interruttore "Solo i suoi giorni" */
.scheda__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scheda__actions .switch { flex: 1; }
.switch {
  display: flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 0 12px 0 10px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  font-size: 13.5px; font-weight: 500; color: var(--ink); cursor: pointer;
}
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch__track {
  position: relative; width: 40px; height: 24px; flex: none;
  background: var(--line-strong); border-radius: 12px; transition: background .16s ease;
}
.switch__track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  background: var(--surface); border-radius: 50%; transition: transform .16s ease;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.switch input:checked + .switch__track { background: var(--hl-ring); }
.switch input:checked + .switch__track::after { transform: translateX(16px); }
.switch input:focus-visible + .switch__track { outline: 2px solid var(--focus); outline-offset: 2px; }

/* --------------------------------------------------------------------------
   7. Giorni — un unico foglio, i giorni separati da un filo
   -------------------------------------------------------------------------- */
.cards {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}

/* Gli ospedali si dicono una volta sola e restano in vista mentre si scorre. */
.colbar {
  position: sticky; top: calc(var(--h-header) - 1px); z-index: 20;
  display: grid; grid-template-columns: var(--tpl); gap: 0 8px;
  padding: 8px var(--pad);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  border-radius: 9px 9px 0 0;
}
.colbar__h {
  display: flex; align-items: center; gap: 5px; padding-left: 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}

.day {
  padding: 12px 0 0;
  scroll-margin-top: calc(var(--h-header) + var(--h-cols, 32px) + 8px);
}
.day + .day { border-top: 1px solid var(--line); }
.day.is-weekend { background: var(--weekend); }
.day:last-child { border-radius: 0 0 9px 9px; }

.day__hd { display: flex; align-items: baseline; gap: 8px; padding: 0 var(--pad) 5px; }
.day__num {
  font-family: var(--mono); font-size: 22px; font-weight: 500; line-height: 1.05;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.day__num.is-today {
  display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 2px;
  border-radius: 50%; box-shadow: inset 0 0 0 2px var(--hl-ring); font-size: 17px;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
.day__wd { font-size: 13px; color: var(--ink-2); }
.day.is-weekend .day__wd { color: var(--ink); }
.day__oggi {
  margin-left: auto; padding: 0 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink);
  box-shadow: inset 0 -.7em 0 var(--hl-soft);
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}

.day__row {
  display: grid; grid-template-columns: var(--tpl); gap: 0 8px;
  padding: 3px var(--pad); align-items: start;
}
.day__row:last-child { padding-bottom: 11px; }
.day__row.is-night { background: var(--night-veil); }
.day__lab { padding-top: 8px; min-width: 0; }
.day__lab b { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; color: var(--ink-2); }
.day__lab b .ico { width: 11px; height: 11px; color: var(--muted); }
.day__lab time { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day__cell { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.day__cell.has-find { border-left: 2px solid var(--fsev, var(--sev2)); margin-left: -8px; padding-left: 6px; }
.day__cell.sev-3 { --fsev: var(--sev3); }
.day__cell.sev-2 { --fsev: var(--sev2); }
.day__cell.sev-1 { --fsev: var(--sev1); }
.dash { padding: 7px 6px; color: var(--line-strong); font-size: 13px; }

.pill {
  display: flex; align-items: center; gap: 5px; width: fit-content; max-width: 100%;
  padding: 7px 6px;
  background: none; border: 0; border-radius: 4px; cursor: pointer; text-align: left;
  font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: .01em;
  color: var(--ink); overflow-wrap: break-word;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease, transform .08s ease;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
.pill:hover { background: var(--surface-2); }
.pill:active { transform: scale(.97); }
.pill.is-soft { background: var(--hl-soft); color: var(--hl-soft-ink); }
.pill.is-strong { background: var(--hl); color: var(--hl-ink); }
.pill .fdot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--sev2); }
.pill .fdot.sev-3 { background: var(--sev3); }
.pill .fdot.sev-2 { background: var(--sev2); }
.pill .fdot.sev-1 { background: var(--sev1); }

.is-pinned .pill:not(.is-strong) { opacity: .45; }

@keyframes flashcard { from { background-color: var(--hl-soft); } }
.day.is-flash { animation: flashcard 1.2s ease-out; }

/* --------------------------------------------------------------------------
   8. Segnalazioni
   -------------------------------------------------------------------------- */
.findings { padding: 12px; scroll-margin-top: calc(var(--h-header) + 8px); }
.findings__head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.findings__filter { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ink-2); font-size: 12px; text-decoration: underline; text-underline-offset: 2px;
}
.linkbtn:hover { color: var(--ink); }

.fgroup { margin-top: 12px; }
.fgroup__t {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 6px;
}
.fitem {
  display: flex; gap: 10px; width: 100%; text-align: left;
  padding: 9px 10px; margin-bottom: 6px;
  background: var(--surface-2); border: 0; border-left: 3px solid var(--fsev, var(--sev2));
  border-radius: 0 8px 8px 0; cursor: pointer;
}
.fitem:hover { background: var(--line); }
.fitem.sev-3 { --fsev: var(--sev3); }
.fitem.sev-2 { --fsev: var(--sev2); }
.fitem.sev-1 { --fsev: var(--sev1); }
.fitem__body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.fitem__who {
  align-self: flex-start; padding: 2px 5px; margin: -2px 0 0 -5px;
  background: none; border: 0; border-radius: 4px; cursor: pointer;
  font-size: 13.5px; font-weight: 600; letter-spacing: .01em; color: var(--ink);
}
.fitem__who:hover { background: var(--hl-soft); color: var(--hl-soft-ink); }
.fitem__t { font-size: 12.5px; color: var(--ink); }
.fitem__d { font-size: 12px; color: var(--ink-2); }
.fitem__go {
  display: grid; place-items: center; width: 32px; min-height: 40px; flex: none;
  background: none; border: 0; border-radius: 8px; color: var(--muted); cursor: pointer;
}
.fitem__go:hover { color: var(--ink); }
.fitem__go .ico { width: 14px; height: 14px; transform: rotate(-90deg); }

.fempty { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--ink-2); font-size: 13.5px; }
.fempty .ico { color: var(--ok); }

.legenda { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.legenda__t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.legenda__row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
.legenda__mark { width: 3px; border-radius: 2px; flex: none; background: var(--muted); margin: 2px 0; }
.legenda__mark.sev-3 { background: var(--sev3); }
.legenda__mark.sev-2 { background: var(--sev2); }
.legenda__mark.sev-1 { background: var(--sev1); }
.legenda__row b { font-weight: 600; color: var(--ink); }

/* --------------------------------------------------------------------------
   9. Dati
   -------------------------------------------------------------------------- */
.dati {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  font-size: 12.5px;
}
.dati__sum {
  display: flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 12px; cursor: pointer;
  font-weight: 500; color: var(--ink-2); list-style: none;
}
.dati__sum::-webkit-details-marker { display: none; }
.dati__chev { transition: transform .15s ease; color: var(--muted); }
.dati[open] .dati__chev { transform: rotate(180deg); }
.dati__body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 12px; color: var(--ink-2); }
.dati__block { display: flex; flex-direction: column; gap: 6px; }
.dati__t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.src:first-of-type { border-top: 0; }
.src__file { font-family: var(--mono); font-size: 11.5px; color: var(--ink); overflow-wrap: anywhere; }
.src__meta { width: 100%; font-size: 11.5px; color: var(--muted); }
.badge {
  padding: 2px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
}
.badge.is-browser { background: var(--hl-soft); border-color: var(--hl-ring); color: var(--hl-soft-ink); }
.minibtn {
  min-height: 32px; padding: 0 10px;
  background: none; border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink-2); font-size: 12px; cursor: pointer;
}
.minibtn:hover { border-color: var(--line-strong); color: var(--ink); }
.warnrow { display: flex; gap: 6px; align-items: flex-start; font-size: 11.5px; color: var(--ink-2); }
.warnrow .ico { width: 13px; height: 13px; color: var(--sev2); margin-top: 2px; }
.dati__note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

/* --------------------------------------------------------------------------
   10. Caricamento, avvisi, stato vuoto
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn--solid { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn--solid:hover { background: var(--ink-2); border-color: var(--ink-2); }

.empty { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty__ico { width: 28px; height: 28px; color: var(--hl-ring); }
.empty__t { font-family: var(--display); font-size: 24px; }
.empty__p { font-size: 13px; color: var(--ink-2); max-width: 40ch; }

.dropzone {
  position: fixed; inset: 0; z-index: 80;
  display: grid; place-items: center; padding: 20px;
  background: var(--scrim); backdrop-filter: blur(2px);
}
.dropzone__frame {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 40px 32px; width: min(520px, 100%);
  border: 2px dashed var(--hl); border-radius: 14px; background: var(--surface);
  box-shadow: var(--shadow);
}
.dropzone__ico { width: 30px; height: 30px; color: var(--hl-ring); }
.dropzone__t { font-family: var(--display); font-size: 24px; text-align: center; color: var(--ink); }

.toasts {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 0 12px calc(14px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 8px;
  width: min(520px, 100%); padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-left: 3px solid var(--ok); border-radius: 8px;
  box-shadow: var(--shadow); font-size: 13px; color: var(--ink);
  animation: toastin .18s ease-out;
}
.toast.is-error { border-left-color: var(--sev3); }
.toast .ico { margin-top: 2px; color: var(--ok); }
.toast.is-error .ico { color: var(--sev3); }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

/* --------------------------------------------------------------------------
   11. Schermi larghi — stessa colonna, centrata
   -------------------------------------------------------------------------- */
@media (min-width: 640px) {
  :root { --fs: 15px; --pad: 16px; }
  .wordmark, .month__t { font-size: 23px; }
  .day__num { font-size: 24px; }
  .stitle { font-size: 21px; }
  .strip__names.is-clamped { max-height: 136px; }
}

/* Telefoni piccoli (320px): stessa struttura, tutto un filo più stretto. */
@media (max-width: 379px) {
  :root { --labelw: 76px; --pad: 10px; }
  .wordmark, .month__t { font-size: 18px; }
  .toprow { gap: 8px; }
  .toprow__end { gap: 6px; }
  .pillbtn, .ghostbtn { padding: 0 8px; font-size: 12px; }
  .day__hd { gap: 6px; }
}

/* --------------------------------------------------------------------------
   12. Movimento ridotto
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .pill:active, .chip:active, .pillbtn:active, .ghostbtn:active, .btn:active,
  .minibtn:active, .fitem:active, button.mm__d:active { transform: none; }
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

/* --------------------------------------------------------------------------
   13. Stampa — resta il mese, il nome fissato e le schede dei giorni
   -------------------------------------------------------------------------- */
@media print {
  @page { margin: 12mm; }
  :root { --fs: 10pt; }
  body { background: #fff; color: #000; }
  .topbar { position: static; border: 0; padding: 0; }
  .search, .toprow__end .pillbtn, .toprow__end .ghostbtn, .skiplink,
  .toasts, .dropzone, .dati, .findings, .strip__names, .strip__more,
  .mm, .mm__legend, .switch, .scheda__unpin, .scheda__findings, .fitem__go { display: none !important; }
  .colbar { position: static; }
  .topbar__in { padding: 0 0 6pt; border-bottom: 1pt solid #999; }
  .page { padding: 8pt 0 0; max-width: none; }
  .strip { border: 0; padding: 0; }
  .strip:not(.is-scheda) { display: none; }
  .card, .day { border-color: #bbb; break-inside: avoid; }
  .day { box-shadow: none; }
  .pill, .scheda__name, .pintoken, .day__oggi { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .is-pinned .pill:not(.is-strong) { opacity: 1; color: #555; }
}

<script>
'use strict';

// parser.js -- xlsx (zero dependencies) -> Roster
// Works both as a classic <script> in the browser (window.TurniParser) and
// as a CommonJS module in Node 22 (module.exports). See README.md / SPEC for
// the exact data model and parsing rules this file implements.

const TurniParser = (function () {

  // ============================================================
  // Phase 0: small generic helpers (strings, refs, dates)
  // ============================================================

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function collapseWs(s) {
    return s.replace(/\s+/g, ' ').trim();
  }

  function stripAccents(s) {
    // Strip Unicode combining marks (range U+0300-U+036F) left behind by NFD
    // normalization, e.g. "e" + combining acute -> "e". Written via numeric
    // code points (rather than a \uXXXX-\uXXXX regex range) to keep the
    // source file free of raw combining characters.
    const COMBINING_LO = 0x0300;
    const COMBINING_HI = 0x036f;
    let out = '';
    const decomposed = s.normalize('NFD');
    for (let i = 0; i < decomposed.length; i++) {
      const code = decomposed.charCodeAt(i);
      if (code < COMBINING_LO || code > COMBINING_HI) out += decomposed.charAt(i);
    }
    return out;
  }

  function basename(p) {
    const parts = String(p).split(/[\\/]/);
    return parts[parts.length - 1];
  }

  // "AB12" -> "AB"
  function colLetters(ref) {
    const m = /^[A-Za-z]+/.exec(ref);
    return m ? m[0].toUpperCase() : '';
  }

  // "AB12" -> 12
  function rowNum(ref) {
    const m = /\d+/.exec(ref);
    return m ? parseInt(m[0], 10) : NaN;
  }

  // "A" -> 1, "Z" -> 26, "AA" -> 27, "AB" -> 28
  function colIndex(letters) {
    const s = letters.toUpperCase();
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      n = n * 26 + (s.charCodeAt(i) - 64);
    }
    return n;
  }

  function toUint8Array(bytes) {
    if (bytes instanceof Uint8Array) return bytes;
    if (bytes instanceof ArrayBuffer) return new Uint8Array(bytes);
    throw new Error('parseWorkbook: bytes must be a Uint8Array or ArrayBuffer');
  }

  function utf8Decode(u8) {
    return new TextDecoder('utf-8').decode(u8);
  }

  // ============================================================
  // Phase 1: XML entity / attribute helpers
  // ============================================================

  const ENTITY_RE = /&(#x[0-9a-fA-F]+|#[0-9]+|amp|lt|gt|quot|apos);/g;

  function decodeEntities(s) {
    if (s.indexOf('&') === -1) return s;
    return s.replace(ENTITY_RE, function (whole, ent) {
      if (ent.charAt(0) === '#') {
        const isHex = ent.charAt(1) === 'x' || ent.charAt(1) === 'X';
        const code = isHex ? parseInt(ent.slice(2), 16) : parseInt(ent.slice(1), 10);
        return String.fromCodePoint(code);
      }
      switch (ent) {
        case 'amp': return '&';
        case 'lt': return '<';
        case 'gt': return '>';
        case 'quot': return '"';
        case 'apos': return '\'';
        default: return whole;
      }
    });
  }

  // Generic attribute-string ("a=\"1\" b='2'") -> {a:"1", b:"2"}. Order-independent.
  function parseAttrs(attrStr) {
    const attrs = {};
    if (!attrStr) return attrs;
    const re = /([a-zA-Z_:][-a-zA-Z0-9_:.]*)\s*=\s*"([^"]*)"|([a-zA-Z_:][-a-zA-Z0-9_:.]*)\s*=\s*'([^']*)'/g;
    let m;
    while ((m = re.exec(attrStr))) {
      if (m[1] !== undefined) attrs[m[1]] = decodeEntities(m[2]);
      else attrs[m[3]] = decodeEntities(m[4]);
    }
    return attrs;
  }

  // First occurrence of <tag>content</tag> or <tag/> inside `content`.
  // Returns the inner text, or null if the tag is absent entirely.
  function firstTag(content, tag) {
    const re = new RegExp('<' + tag + '\\b[^>]*\\/>|<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>');
    const m = re.exec(content);
    if (!m) return null;
    return m[1] !== undefined ? m[1] : '';
  }

  // Concatenation of every <tag>...</tag> (or self-closing) occurrence inside `content`.
  function allTagText(content, tag) {
    const re = new RegExp('<' + tag + '\\b[^>]*\\/>|<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>', 'g');
    let out = '';
    let m;
    while ((m = re.exec(content))) {
      out += m[1] !== undefined ? m[1] : '';
    }
    return out;
  }

  function extractIs(cellInner) {
    const m = /<is\b[^>]*\/>|<is\b[^>]*>([\s\S]*?)<\/is>/.exec(cellInner);
    if (!m) return cellInner;
    return m[1] !== undefined ? m[1] : '';
  }

  // ============================================================
  // Phase 2: ZIP reading (no dependencies)
  // ============================================================

  const EOCD_SIG = 0x06054b50;
  const CEN_SIG = 0x02014b50;
  const LOC_SIG = 0x04034b50;

  async function readZip(bytes) {
    const u8 = toUint8Array(bytes);
    if (u8.length < 22) throw new Error('File ZIP non valido: troppo piccolo');
    const view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    // find End Of Central Directory scanning backwards (comment can be up to 65535 bytes)
    const maxBack = Math.min(u8.length, 22 + 65535);
    let eocd = -1;
    for (let i = u8.length - 22; i >= u8.length - maxBack; i--) {
      if (i < 0) break;
      if (view.getUint32(i, true) === EOCD_SIG) { eocd = i; break; }
    }
    if (eocd === -1) throw new Error('File ZIP non valido: End Of Central Directory non trovato');

    const totalEntries = view.getUint16(eocd + 10, true);
    let off = view.getUint32(eocd + 16, true);

    const entries = new Map();
    for (let i = 0; i < totalEntries; i++) {
      if (view.getUint32(off, true) !== CEN_SIG) {
        throw new Error('File ZIP non valido: central directory malformata');
      }
      const method = view.getUint16(off + 10, true);
      const compSize = view.getUint32(off + 20, true);
      const nameLen = view.getUint16(off + 28, true);
      const extraLen = view.getUint16(off + 30, true);
      const commentLen = view.getUint16(off + 32, true);
      const localOffset = view.getUint32(off + 42, true);
      const name = utf8Decode(u8.subarray(off + 46, off + 46 + nameLen));
      off += 46 + nameLen + extraLen + commentLen;

      if (name.charAt(name.length - 1) === '/') continue; // directory entry, no data

      if (view.getUint32(localOffset, true) !== LOC_SIG) {
        throw new Error('File ZIP non valido: local header malformato per ' + name);
      }
      const localNameLen = view.getUint16(localOffset + 26, true);
      const localExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + localNameLen + localExtraLen;
      const compData = u8.subarray(dataStart, dataStart + compSize);

      let data;
      if (method === 0) {
        data = compData.slice();
      } else if (method === 8) {
        data = await inflateRaw(compData);
      } else {
        throw new Error('Metodo di compressione ZIP non supportato (' + method + ') per ' + name);
      }
      entries.set(name, data);
    }
    return entries;
  }

  // Raw DEFLATE inflate, kept isolated: Node uses zlib, the browser uses
  // DecompressionStream('deflate-raw') (both act on headerless deflate streams).
  async function inflateRaw(u8) {
    const isNode = typeof process !== 'undefined' && process.versions && process.versions.node;
    if (isNode) {
      const zlib = require('zlib');
      return new Uint8Array(zlib.inflateRawSync(u8));
    }
    const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  // ============================================================
  // Phase 3: shared strings + sheet cell extraction
  // ============================================================

  function parseSharedStrings(xml) {
    if (!xml) return [];
    const out = [];
    const re = /<si\b[^>]*\/>|<si\b[^>]*>([\s\S]*?)<\/si>/g;
    let m;
    while ((m = re.exec(xml))) {
      const content = m[1] !== undefined ? m[1] : '';
      out.push(decodeEntities(allTagText(content, 't')));
    }
    return out;
  }

  function cellTextFromInner(type, inner, sharedStrings) {
    if (type === 's') {
      const v = firstTag(inner, 'v');
      if (v === null) return '';
      const idx = parseInt(v, 10);
      return sharedStrings[idx] !== undefined ? sharedStrings[idx] : '';
    }
    if (type === 'inlineStr') {
      return decodeEntities(allTagText(extractIs(inner), 't'));
    }
    if (type === 'str') {
      const v = firstTag(inner, 'v');
      return v === null ? '' : decodeEntities(v);
    }
    if (type === 'b') {
      const v = firstTag(inner, 'v');
      if (v === '1') return 'TRUE';
      if (v === '0') return 'FALSE';
      return '';
    }
    if (type === 'e') {
      return '';
    }
    // absent or "n": plain number, kept as its literal text
    const v = firstTag(inner, 'v');
    return v === null ? '' : decodeEntities(v);
  }

  // Iterates every <c ...>...</c> / <c .../> in a worksheet XML string.
  // Returns Map<ref, text> containing only non-empty cells.
  function parseSheetCells(sheetXml, sharedStrings) {
    const strings = sharedStrings || [];
    const cells = new Map();
    const re = /<c\b([^>]*)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g;
    let m;
    while ((m = re.exec(sheetXml))) {
      const attrStr = m[1] !== undefined ? m[1] : m[2];
      const inner = m[3] || '';
      const attrs = parseAttrs(attrStr);
      if (!attrs.r) continue;
      const text = cellTextFromInner(attrs.t, inner, strings);
      if (text !== '') cells.set(attrs.r, text);
    }
    return cells;
  }

  // ============================================================
  // Phase 4: names (splitting / normalizing)
  // ============================================================

  function normalizeName(s) {
    return s
      .replace(/[’‘`]/g, '\'')
      .replace(/\s+/g, ' ')
      .trim()
      .toLocaleUpperCase('it-IT');
  }

  function splitNames(raw) {
    if (!raw) return [];
    return raw
      .split(/[\/,;+&\n]/)
      .map(normalizeName)
      .filter(function (x) { return x.length > 0; });
  }

  // ============================================================
  // Phase 5: time ranges, months, weekdays
  // ============================================================

  const TIME_RANGE_RE = /(\d{1,2})(?:[.:,](\d{2}))?\s*[-–—]\s*(\d{1,2})(?:[.:,](\d{2}))?/;

  function parseTimeRange(headerText) {
    const m = TIME_RANGE_RE.exec(headerText);
    if (!m) return null;
    const sh = parseInt(m[1], 10);
    const sm = m[2] ? parseInt(m[2], 10) : 0;
    const eh = parseInt(m[3], 10);
    const em = m[4] ? parseInt(m[4], 10) : 0;
    const startMin = sh * 60 + sm;
    let endMin = eh * 60 + em;
    if (endMin <= startMin) endMin += 1440;
    const label = collapseWs(headerText.slice(0, m.index) + headerText.slice(m.index + m[0].length));
    return {
      label: label,
      start: pad2(sh) + ':' + pad2(sm),
      end: pad2(eh) + ':' + pad2(em),
      startMin: startMin,
      endMin: endMin
    };
  }

  const MONTHS_IT = ['GENNAIO', 'FEBBRAIO', 'MARZO', 'APRILE', 'MAGGIO', 'GIUGNO',
    'LUGLIO', 'AGOSTO', 'SETTEMBRE', 'OTTOBRE', 'NOVEMBRE', 'DICEMBRE'];

  // Accepts "<mese> <anno>" with any separator (space, underscore, ...) between
  // the month word and the year, so it also works directly against filenames
  // like "TURNI_PS_DEA_SETTEMBRE_2026.xlsx".
  function monthFromLabel(label) {
    if (!label) return null;
    const re = /([A-Za-zÀ-ÿ]+)[^A-Za-zÀ-ÿ0-9]*(\d{4})/;
    const m = re.exec(label);
    if (!m) return null;
    const prefix = stripAccents(m[1]).toUpperCase().slice(0, 3);
    const idx = MONTHS_IT.findIndex(function (mo) { return mo.slice(0, 3) === prefix; });
    if (idx === -1) return null;
    return m[2] + '-' + pad2(idx + 1);
  }

  const WEEKDAYS_IT = ['LUNEDI', 'MARTEDI', 'MERCOLEDI', 'GIOVEDI', 'VENERDI', 'SABATO', 'DOMENICA'];
  // indexed by Date#getUTCDay() (0 = Sunday)
  const WEEKDAY_BY_JSDAY = ['DOMENICA', 'LUNEDI', 'MARTEDI', 'MERCOLEDI', 'GIOVEDI', 'VENERDI', 'SABATO'];

  function normalizeWeekday(s) {
    if (s == null) return '';
    return stripAccents(String(s))
      .replace(/['’`]/g, '')
      .toUpperCase()
      .trim();
  }

  function daysInMonth(year, month1based) {
    return new Date(Date.UTC(year, month1based, 0)).getUTCDate();
  }

  // ============================================================
  // Phase 6: workbook.xml / rels (sheet list + sheet-id -> file resolution)
  // ============================================================

  function parseWorkbookSheets(xml) {
    const out = [];
    const re = /<sheet\b([^>]*)\/>|<sheet\b([^>]*)>[\s\S]*?<\/sheet>/g;
    let m;
    while ((m = re.exec(xml))) {
      const attrStr = m[1] !== undefined ? m[1] : m[2];
      const attrs = parseAttrs(attrStr);
      out.push({ name: attrs.name, rId: attrs['r:id'] });
    }
    return out;
  }

  function parseRels(xml) {
    const map = {};
    const re = /<Relationship\b([^>]*)\/>|<Relationship\b([^>]*)>[\s\S]*?<\/Relationship>/g;
    let m;
    while ((m = re.exec(xml))) {
      const attrStr = m[1] !== undefined ? m[1] : m[2];
      const attrs = parseAttrs(attrStr);
      if (attrs.Id) map[attrs.Id] = attrs.Target;
    }
    return map;
  }

  // "worksheets/sheet1.xml" -> "xl/worksheets/sheet1.xml"; "/xl/worksheets/sheet1.xml" -> "xl/worksheets/sheet1.xml"
  function resolveTarget(target) {
    if (target.charAt(0) === '/') return target.slice(1);
    return 'xl/' + target;
  }

  // ============================================================
  // Phase 7: generic cell-map lookups shared by title/period/day scanning
  // ============================================================

  // First cell (reading order: row asc, then column asc) matching `predicate(text, ref)`.
  function findFirstMatch(cellsMap, predicate) {
    let best = null;
    for (const entry of cellsMap) {
      const ref = entry[0];
      const text = entry[1];
      if (!predicate(text, ref)) continue;
      const r = rowNum(ref);
      const c = colIndex(colLetters(ref));
      if (!best || r < best.r || (r === best.r && c < best.c)) {
        best = { ref: ref, text: text, r: r, c: c };
      }
    }
    return best;
  }

  function startsWithCI(text, prefix) {
    return text.trim().toUpperCase().indexOf(prefix) === 0;
  }

  // ============================================================
  // Phase 8: main entry point -- xlsx bytes -> Roster
  // ============================================================

  async function parseWorkbook(bytes, filename) {
    const file = basename(filename);
    const warnings = [];

    // --- read the zip + the workbook-level XML parts ---
    const entries = await readZip(bytes);
    function readEntry(name) {
      const data = entries.get(name);
      return data ? utf8Decode(data) : null;
    }
    const workbookXml = readEntry('xl/workbook.xml');
    if (!workbookXml) throw new Error('xl/workbook.xml non trovato in ' + file);
    const sheetDefs = parseWorkbookSheets(workbookXml);
    const rels = parseRels(readEntry('xl/_rels/workbook.xml.rels') || '');
    const sharedStrings = parseSharedStrings(readEntry('xl/sharedStrings.xml') || '');

    // --- find the first sheet (in workbook order) with a "MATTINA..." header cell ---
    let sheetName = null;
    let cells = null;
    let headerRef = null;
    for (const sd of sheetDefs) {
      const target = sd.rId && rels[sd.rId];
      if (!target) continue;
      const sheetXml = readEntry(resolveTarget(target));
      if (sheetXml === null) continue;
      const sheetCells = parseSheetCells(sheetXml, sharedStrings);
      const hit = findFirstMatch(sheetCells, function (text) { return startsWithCI(text, 'MATTINA'); });
      if (hit) {
        sheetName = sd.name;
        cells = sheetCells;
        headerRef = hit.ref;
        break;
      }
    }
    if (!cells) throw new Error('Foglio con intestazione "MATTINA" non trovato in ' + file);
    const headerRow = rowNum(headerRef);

    // --- slot columns on the header row ---
    const slots = buildSlots(cells, headerRow, warnings, file);

    // sub-header row -> roles
    const subRow = headerRow + 1;
    for (const slot of slots) {
      const subText = (cells.get(slot.col + subRow) || '').trim();
      slot.sub = subText;
      slot.roles = subText
        ? subText.split('/').map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 0; })
        : [];
    }

    // --- title / hospital ---
    const title = findTitle(cells, headerRow);
    const hospital = deriveHospital(title, file);

    // --- period / month ---
    const period = findPeriod(cells, file, warnings);

    // --- day rows ---
    const days = buildDays(cells, headerRow, slots, period.month, warnings);

    return {
      file: file,
      sheet: sheetName,
      hospital: hospital,
      title: title,
      periodLabel: period.periodLabel,
      month: period.month,
      slots: slots,
      days: days,
      warnings: warnings
    };
  }

  // ---- helpers used by parseWorkbook (kept separate for readability) ----

  const SLOT_DEFAULTS = {
    M: { start: '08:00', end: '14:00', startMin: 480, endMin: 840 },
    P: { start: '14:00', end: '20:00', startMin: 840, endMin: 1200 },
    N: { start: '20:00', end: '08:00', startMin: 1200, endMin: 1920 },
    A: { start: '09:30', end: '15:00', startMin: 570, endMin: 900 }
  };

  function buildSlots(cells, headerRow, warnings, file) {
    const headerCells = [];
    for (const entry of cells) {
      const ref = entry[0];
      if (rowNum(ref) === headerRow) {
        headerCells.push({ ref: ref, text: entry[1], col: colLetters(ref), ci: colIndex(colLetters(ref)) });
      }
    }
    headerCells.sort(function (a, b) { return a.ci - b.ci; });

    const slots = [];
    let unknownCount = 0;
    for (const hc of headerCells) {
      const header = hc.text.trim();
      const up = header.toUpperCase();
      let key = null;
      if (up.indexOf('MATTINA') !== -1) key = 'M';
      else if (up.indexOf('POMERIGGIO') !== -1) key = 'P';
      else if (up.indexOf('NOTTE') !== -1) key = 'N';
      else if (up.indexOf('AMBULATORIO') !== -1) key = 'A';

      const range = parseTimeRange(header);
      if (key === null && !range) continue; // not a slot column at all

      if (key === null) {
        unknownCount++;
        key = 'X' + unknownCount;
      }

      let label, start, end, startMin, endMin;
      if (range) {
        label = range.label;
        start = range.start; end = range.end;
        startMin = range.startMin; endMin = range.endMin;
      } else if (SLOT_DEFAULTS[key]) {
        const d = SLOT_DEFAULTS[key];
        label = collapseWs(header);
        start = d.start; end = d.end; startMin = d.startMin; endMin = d.endMin;
        warnings.push({
          type: 'slot-default-time',
          message: 'Nessun orario nell\'intestazione "' + header + '", uso orario predefinito ' + start + '-' + end,
          row: headerRow
        });
      } else {
        throw new Error('Intestazione turno senza orario riconoscibile: "' + header + '" in ' + file);
      }

      slots.push({
        key: key, label: label, header: header, sub: '', roles: [],
        start: start, end: end, startMin: startMin, endMin: endMin, col: hc.col
      });
    }
    if (slots.length === 0) throw new Error('Nessuna colonna turno trovata in ' + file);
    return slots;
  }

  function findTitle(cells, headerRow) {
    const turniHit = findFirstMatch(cells, function (text, ref) {
      return rowNum(ref) < headerRow && startsWithCI(text, 'TURNI');
    });
    if (turniHit) return turniHit.text.trim();
    const anyHit = findFirstMatch(cells, function (text, ref) { return rowNum(ref) < headerRow; });
    return anyHit ? anyHit.text.trim() : '';
  }

  function deriveHospital(title, file) {
    const titleUp = title.toUpperCase();
    let hospital;
    if (titleUp.indexOf('OSG') !== -1) hospital = 'OSG';
    else if (titleUp.indexOf('DEA') !== -1) hospital = 'DEA';
    else hospital = collapseWs(title.replace(/TURNI/gi, '').replace(/PS/gi, ''));

    if (!hospital) {
      const fileUp = file.toUpperCase();
      if (fileUp.indexOf('OSG') !== -1) hospital = 'OSG';
      else if (fileUp.indexOf('DEA') !== -1) hospital = 'DEA';
      else hospital = '?';
    }
    return hospital;
  }

  function findPeriod(cells, file, warnings) {
    let periodLabel = '';
    const periodoHit = findFirstMatch(cells, function (text) { return startsWithCI(text, 'PERIODO'); });
    if (periodoHit) {
      const pr = periodoHit.r;
      const pc = periodoHit.c;
      const rightHit = findFirstMatch(cells, function (text, ref) {
        return rowNum(ref) === pr && colIndex(colLetters(ref)) > pc;
      });
      if (rightHit) periodLabel = rightHit.text.trim();
    }

    let month = periodLabel ? monthFromLabel(periodLabel) : null;
    if (!month) {
      const fromFile = monthFromLabel(file);
      if (fromFile) {
        month = fromFile;
        warnings.push({ type: 'period-from-filename', message: 'Periodo dedotto dal nome del file ' + file });
      }
    }
    if (!month) throw new Error('Periodo di riferimento non trovato in ' + file);

    return { periodLabel: periodLabel, month: month };
  }

  function buildDays(cells, headerRow, slots, month, warnings) {
    const year = parseInt(month.slice(0, 4), 10);
    const monthNum = parseInt(month.slice(5, 7), 10);
    const ndays = daysInMonth(year, monthNum);
    const subHeaderRow = headerRow + 1;

    const candidates = [];
    for (const entry of cells) {
      const ref = entry[0];
      if (colLetters(ref) !== 'A') continue;
      const r = rowNum(ref);
      if (r <= subHeaderRow) continue;
      const t = entry[1].trim();
      if (!/^\d{1,2}$/.test(t)) continue;
      const d = parseInt(t, 10);
      if (d < 1 || d > 31) continue;
      candidates.push({ row: r, day: d });
    }
    candidates.sort(function (a, b) { return a.row - b.row; });

    const days = [];
    const seen = new Set();
    for (const cand of candidates) {
      const d = cand.day;
      const r = cand.row;

      if (d > ndays) {
        warnings.push({ type: 'day-out-of-range', message: 'Giorno ' + d + ' oltre la fine del mese', row: r, day: d });
        continue;
      }
      if (seen.has(d)) {
        warnings.push({ type: 'day-duplicate', message: 'Giorno ' + d + ' duplicato', row: r, day: d });
        continue;
      }
      seen.add(d);

      const weekdayLabel = (cells.get('B' + r) || '').trim();
      const expected = WEEKDAY_BY_JSDAY[new Date(Date.UTC(year, monthNum - 1, d)).getUTCDay()];
      const weekdayOk = normalizeWeekday(weekdayLabel) === expected;
      if (!weekdayOk) {
        warnings.push({
          type: 'weekday-mismatch',
          message: 'Giorno ' + d + ': etichetta "' + (weekdayLabel || '(vuoto)') + '", atteso ' + expected,
          row: r,
          day: d
        });
      }

      const dayCells = {};
      for (const slot of slots) {
        const raw = (cells.get(slot.col + r) || '').trim();
        dayCells[slot.key] = { raw: raw, names: splitNames(raw) };
      }

      days.push({
        day: d,
        date: month + '-' + pad2(d),
        weekdayLabel: weekdayLabel,
        weekdayOk: weekdayOk,
        cells: dayCells
      });
    }
    days.sort(function (a, b) { return a.day - b.day; });
    return days;
  }

  // ============================================================
  // Public API
  // ============================================================

  return {
    parseWorkbook: parseWorkbook,
    readZip: readZip,
    parseSheetCells: parseSheetCells,
    parseSharedStrings: parseSharedStrings,
    decodeEntities: decodeEntities,
    normalizeName: normalizeName,
    splitNames: splitNames,
    parseTimeRange: parseTimeRange,
    monthFromLabel: monthFromLabel,
    normalizeWeekday: normalizeWeekday,
    colLetters: colLetters,
    rowNum: rowNum,
    colIndex: colIndex,
    inflateRaw: inflateRaw
  };

})();

if (typeof module !== 'undefined' && module.exports) module.exports = TurniParser; else window.TurniParser = TurniParser;

<script>
// src/rules.js — "I Miei Turni": motore delle regole (nessuna dipendenza dal DOM).
//
// Prende in input i Roster prodotti da src/parser.js e calcola:
//   - buildAssignments: l'elenco piatto dei turni assegnati (una riga per persona/turno);
//   - computeFindings:  le anomalie tra turni della stessa persona (conflitti, notti
//                        attaccate, cambi di sede senza pausa);
//   - analyzeNames / searchNames: analisi e ricerca dei nomi (per intercettare refusi).
//
// Tutte le funzioni sono pure: nessun accesso al DOM, nessuna dipendenza esterna.

var TurniRules = (function () {
  'use strict';

  // ------------------------------------------------------------------
  // Costanti
  // ------------------------------------------------------------------

  var SEVERITY = { conflitto: 3, 'notte-attaccata': 2, 'cambio-sede': 1 };
  var KIND_LABEL = { conflitto: 'Conflitto', 'notte-attaccata': 'Notte attaccata', 'cambio-sede': 'Cambio sede' };

  var MINUTES_PER_DAY = 1440;
  var FORTYEIGHT_HOURS_MIN = 48 * 60;

  var WEEKDAY_SHORT_IT = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab']; // indicizzato su getUTCDay() (0 = domenica)
  var MONTH_SHORT_IT = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

  // ------------------------------------------------------------------
  // Helper di base: date, testo
  // ------------------------------------------------------------------

  // Numero di giorni trascorsi dal 1970-01-01 (UTC) — calcolato sempre in UTC così
  // il risultato non dipende dal fuso orario della macchina che esegue il codice.
  function dayIndex(dateStr) {
    var parts = String(dateStr).split('-');
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  }

  // "2026-09-01" → "mar 1 set" (giorno della settimana e mese abbreviati in italiano, minuscoli, senza punto).
  function formatDate(dateStr) {
    var parts = String(dateStr).split('-');
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    var dt = new Date(Date.UTC(y, m - 1, d));
    return WEEKDAY_SHORT_IT[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + MONTH_SHORT_IT[dt.getUTCMonth()];
  }

  // 0 → "0 h"; 360 → "6 h"; 90 → "1 h 30" (ore intere + eventuali minuti).
  function formatRest(min) {
    var h = Math.floor(min / 60);
    var r = min % 60;
    return r === 0 ? (h + ' h') : (h + ' h ' + r);
  }

  // "MATTINA" → "Mattina"; "AMBULATORIO CM" → "Ambulatorio CM" (le sigle di due lettere
  // restano maiuscole, le altre parole diventano Title Case).
  function slotName(label) {
    var words = String(label).trim().split(/\s+/);
    var out = [];
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (w.length === 0) continue;
      out.push(w.length <= 2 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
    }
    return out.join(' ');
  }

  // "08:00" → "08"; "09:30" → "09:30" (i minuti a zero si tolgono, gli altri restano).
  function fmtClock(t) {
    return t.slice(-3) === ':00' ? t.slice(0, -3) : t;
  }

  // Accetta uno Slot ({start,end}) o un Assignment ({slotStart,slotEnd}):
  // "08–14", "20–08", "09:30–15" (trattino medio, ":00" tolto, ":30" mantenuto).
  function timeRange(x) {
    var start = x.start !== undefined ? x.start : x.slotStart;
    var end = x.end !== undefined ? x.end : x.slotEnd;
    return fmtClock(start) + '–' + fmtClock(end);
  }

  // NFD, via gli accenti, maiuscolo, via tutto ciò che non è A-Z: "D'AMORE" → "DAMORE",
  // "DI VITA F." → "DIVITAF". Usato per confrontare nomi ignorando accenti/apostrofi/spazi.
  function fold(s) {
    return String(s)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z]/g, '');
  }

  // Distanza di Levenshtein (numero minimo di inserimenti/cancellazioni/sostituzioni).
  function levenshtein(a, b) {
    a = String(a);
    b = String(b);
    var m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    var prev = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      var cur = new Array(n + 1);
      cur[0] = i;
      var ca = a.charAt(i - 1);
      for (j = 1; j <= n; j++) {
        var cost = ca === b.charAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);

  // ------------------------------------------------------------------
  // buildAssignments
  // ------------------------------------------------------------------

  // Trasforma i Roster in un elenco piatto di Assignment: un elemento per ogni

  // cella contano una volta sola, alla loro prima posizione).
  function buildAssignments(rosters) {

      var days = roster.days || [];

          var names = cell.names || [];

          var di = dayIndex(day.date);
          for (var pos = 0; pos < names.length; pos++) {
            var name = names[pos];
            if (seen[name]) continue;
            seen[name] = true;
            out.push({
              id: roster.hospital + '|' + day.date + '|' + slot.key + '|' + pos,
              person: name,
              hospital: roster.hospital,
              date: day.date,
              day: day.day,
              slotKey: slot.key,
              slotLabel: slot.label,
              slotStart: slot.start,
              slotEnd: slot.end,
              pos: pos,
              role: (slot.roles && slot.roles[pos]) || '',
              startAbs: di * MINUTES_PER_DAY + slot.startMin,

  }

  // Dettaglio di notte-attaccata / cambio-sede: sempre in sequenza (a → b), con il
  // riposo residuo in fondo.
  function sequenceDetail(a, b, restMin) {
    return piece(a) + ' ' + formatDate(a.date) + ' → ' + piece(b) + ' ' + formatDate(b.date) +

  }

  // Regola "conflitto": due turni della stessa persona si sovrappongono nel tempo.
  // In ospedali diversi qualunque sovrapposizione conta; nello stesso ospedale conta
  // solo se supera i 60 minuti (altrimenti è un normale passaggio di consegne).
  function checkConflitto(person, a, b, overlap) {

      severity: SEVERITY.conflitto,
      person: person,
      a: a,
      b: b,
      overlapMin: overlap,
      date: a.date,
      title: sameHospital ? 'Doppio incarico nello stesso ospedale' : 'Stesso orario in due ospedali',
      detail: conflittoDetail(a, b),

  // Regola "notte-attaccata": una notte è troppo vicina (meno di 11 ore di riposo) a un
  // turno diurno, prima o dopo, in qualsiasi ospedale.
  function checkNotteAttaccata(person, a, b, rest) {
    if (a.isNight === b.isNight) return null; // servono una notte e un turno diurno
    if (!(rest >= 0 && rest < 660)) return null;
    return {
      kind: 'notte-attaccata',
      severity: SEVERITY['notte-attaccata'],
      person: person,
      a: a,
      b: b,
      restMin: rest,
      date: a.date,
      title: rest === 0 ? 'Notte attaccata a un turno diurno' : 'Riposo breve intorno alla notte',
      detail: sequenceDetail(a, b, rest),

  }

  // Regola "cambio-sede": due turni diurni in ospedali diversi con meno di 60 minuti di
  // pausa tra loro (turni diurni consecutivi nello stesso ospedale sono un unico turno,
  // non un'anomalia).
  function checkCambioSede(person, a, b, rest) {
    if (a.isNight || b.isNight) return null;
    if (a.hospital === b.hospital) return null;
    if (!(rest >= 0 && rest < 60)) return null;
    return {
      kind: 'cambio-sede',
      severity: SEVERITY['cambio-sede'],
      person: person,
      a: a,
      b: b,
      restMin: rest,
      date: a.date,
      title: 'Cambio di sede senza pausa',
      detail: sequenceDetail(a, b, rest),
    };
  }

  function evaluatePair(person, a, b) {
    var overlap = Math.min(a.endAbs, b.endAbs) - Math.max(a.startAbs, b.startAbs);
    if (overlap > 0) return checkConflitto(person, a, b, overlap);
    var rest = b.startAbs - a.endAbs;

  function comparePersonAssignments(x, y) {
    if (x.startAbs !== y.startAbs) return x.startAbs - y.startAbs;
    if (x.date !== y.date) return x.date < y.date ? -1 : 1;
    if (x.hospital !== y.hospital) return x.hospital < y.hospital ? -1 : 1;
    return 0;
  }

  // Confronta ogni coppia di turni della stessa persona la cui distanza tra gli orari di
  // inizio è inferiore a 48 ore (n è piccolo: un confronto O(n²) per persona va benissimo).
  function computeFindings(assignments) {

      var a = assignments[i];

      if (!list) { list = []; byPerson.set(a.person, list); }
      list.push(a);

  // ------------------------------------------------------------------
  // analyzeNames
  // ------------------------------------------------------------------

  // Un nome raro (al più 2 turni) è probabilmente due nomi concatenati per errore se il
  // suo testo, ripulito, è esattamente l'unione di altri due nomi frequenti (>= 2 turni).
  function findConcat(n, list) {
    var foldedN = fold(n.name);
    for (var i = 0; i < list.length; i++) {

      var foldedA = fold(A.name);
      for (var j = 0; j < list.length; j++) {

        if (foldedA + fold(B.name) === foldedN) return { A: A, B: B };
      }
    }
    return null;
  }

  // Un nome raro (al più 2 turni) è probabilmente un refuso di un nome molto più
  // frequente (almeno 3 volte più turni) se le due forme ripulite sono quasi identiche
  // (distanza di Levenshtein <= 2, o <= 1 se il nome è molto corto).
  function findSimilar(n, list) {
    var foldedN = fold(n.name);
    var limit = foldedN.length <= 5 ? 1 : 2;
    var best = null;
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (o.name === n.name || o.count < 3 * n.count) continue;
      var d = levenshtein(foldedN, fold(o.name));
      if (d > limit) continue;
      if (!best || d < best.d || (d === best.d && o.count > best.o.count)) best = { d: d, o: o };
    }
    return best ? { kind: 'similar', to: best.o.name, distance: best.d } : null;
  }

  // Aggrega gli Assignment per persona (conteggio, per ospedale, notti) e segnala i nomi
  // sospetti: probabile concatenazione di due nomi, oppure probabile refuso di un nome
  // frequente.
  function analyzeNames(assignments) {
    var map = new Map();
    for (var i = 0; i < assignments.length; i++) {
      var a = assignments[i];
      var info = map.get(a.person);
      if (!info) {
        info = { name: a.person, count: 0, byHospital: {}, nights: 0, suspicion: null };
        map.set(a.person, info);
      }
      info.count++;
      info.byHospital[a.hospital] = (info.byHospital[a.hospital] || 0) + 1;
      if (a.isNight) info.nights++;

    var list = Array.from(map.values());
    for (i = 0; i < list.length; i++) {
      var n = list[i];
      if (n.count > 2) continue; // il sospetto si valuta solo sui nomi rari
      var concat = findConcat(n, list);
      if (concat) {
        n.suspicion = { kind: 'concat', parts: [concat.A.name, concat.B.name], suggestion: concat.A.name + '/' + concat.B.name };
        continue;
      }
      var similar = findSimilar(n, list);
      if (similar) n.suspicion = similar;
    }

  // searchNames
  // ------------------------------------------------------------------

  function wordsOf(name) {
    return String(name).split(/[\s'.]+/).filter(function (w) { return w.length > 0; });
  }

  function isSubsequence(needle, hay) {
    var i = 0;
    for (var j = 0; j < hay.length && i < needle.length; j++) {

  // Punteggio di un nome rispetto a una query già "foldata": corrispondenza esatta,
  // prefisso, prefisso di una delle parole del nome, sottostringa, sottosequenza, e
  // infine un confronto approssimato (Levenshtein) per intercettare i refusi di ricerca.
  function matchScore(q, originalName, foldedName) {
    if (foldedName === q) return 1000;
    if (foldedName.indexOf(q) === 0) return 800;
    var words = wordsOf(originalName);
    for (var i = 0; i < words.length; i++) {

    if (foldedName.indexOf(q) !== -1) return 600;
    if (isSubsequence(q, foldedName)) return 400;

    // pescherebbe anche KASO o PASTORE.
    var fuzzyLimit = q.length <= 5 ? 1 : 2;
    if (q.length >= 3 && levenshtein(q, foldedName.slice(0, q.length)) <= fuzzyLimit) return 300;
    return 0;
  }

  // Cerca tra i NameInfo per query testuale (accenti/apostrofi/maiuscole ignorati).
  // Query vuota o di soli spazi → tutti i nomi in ordine alfabetico.
  function searchNames(query, names) {
    var trimmed = String(query == null ? '' : query).trim();
    if (trimmed === '') {

    }

    if (!q) return [];

    var scored = [];
    for (var i = 0; i < names.length; i++) {
      var n = names[i];
      var score = matchScore(q, n.name, fold(n.name));
      if (score > 0) scored.push({ n: n, score: score });
    }
    scored.sort(function (x, y) {
      if (x.score !== y.score) return y.score - x.score;
      if (x.n.count !== y.n.count) return y.n.count - x.n.count;
      return x.n.name.localeCompare(y.n.name, 'it');
    });
    return scored.map(function (s) { return s.n; });
  }

  // ------------------------------------------------------------------
  // Esportazione
  // ------------------------------------------------------------------

  return {
    buildAssignments: buildAssignments,
    computeFindings: computeFindings,
    analyzeNames: analyzeNames,
    searchNames: searchNames,
    levenshtein: levenshtein,
    fold: fold,
    dayIndex: dayIndex,
    slotName: slotName,
    timeRange: timeRange,
    formatDate: formatDate,
    formatRest: formatRest,
    SEVERITY: SEVERITY,
    KIND_LABEL: KIND_LABEL,
  };
})();
