<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="I Miei Turni">
<meta name="description" content="I turni mensili del Pronto Soccorso di DEA e OSG: cerca un nome, evidenzialo nel calendario, controlla le segnalazioni.">
<title>I Miei Turni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ==========================================================================
   I Miei Turni — foglio di stile unico, mobile first.
   Un foglio solo: titolo, viste (calendario · tabella · ore), giorno scelto,
   segnalazioni, dati. Tutti i colori passano dai token in :root.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Token — un blocco solo, chiaro e scuro con light-dark()
   -------------------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  --bg: light-dark(#F3F4F6, #0E1216);
  --surface: light-dark(#FFFFFF, #161B21);
  --surface-2: light-dark(#F8F9FB, #1C222A);
  --ink: light-dark(#151B22, #E9EDF2);
  --ink-2: light-dark(#4A5563, #B4BCC7);
  --muted: light-dark(#7B8594, #8B95A3);
  --line: light-dark(#E2E5EA, #262D36);
  --line-strong: light-dark(#C9CED6, #3A434F);

  --night-veil: light-dark(rgba(24, 38, 62, .045), rgba(150, 180, 220, .05));
  --weekend: light-dark(#FAF6EC, #191711);

  --hl: light-dark(#FFE45C, #F2D53C);
  --hl-ink: #1A1500;
  --hl-soft: light-dark(#FFF4A8, #5C5117);
  --hl-soft-ink: light-dark(#1A1500, #FFF0A0);

  --dea: light-dark(#0A8F82, #3FBFB0);
  --dea-tint: light-dark(#E4F4F1, #123430);
  --osg: light-dark(#9B3B8E, #C468B4);
  --osg-tint: light-dark(#F5E7F3, #3A1E36);
  --alt: light-dark(#64707E, #94A0AE);
  --alt-tint: light-dark(#ECEEF1, #232A33);

  --sev3: light-dark(#D1343B, #F0616A);
  --sev2: light-dark(#E07B12, #F0A03A);
  --sev1: light-dark(#3B6FD9, #6E9BF0);
  --ok: light-dark(#2E8B57, #5BC98A);

  --focus: light-dark(#2F6FE4, #6E9BF0);
  --scrim: light-dark(rgba(20, 26, 34, .55), rgba(4, 7, 10, .6));
  --shadow-color: light-dark(rgba(16, 22, 30, .16), rgba(0, 0, 0, .55));
  --shadow: 0 10px 30px var(--shadow-color), 0 2px 6px var(--shadow-color);

  --ui: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;

  --fs: 14px;
  --pad: 12px;
  --dlabel: 72px;                         /* colonna delle fasce nel dettaglio */
  --h-header: 58px;                       /* misurata da app.js: la riga di ricerca */
  --tpl: var(--dlabel) 1fr 1fr;
}

:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* --------------------------------------------------------------------------
   2. Base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

/* Un elemento nascosto resta nascosto anche se una classe gli dà un display. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs)/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* Il foglio: una colonna sola, bianca, al centro. */
.topbar, .searchbar, .page { max-width: 640px; margin: 0 auto; background: var(--surface); }

h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

.sprite { display: none; }
.ico { width: 16px; height: 16px; flex: none; display: block; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
.filein { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.skiplink {
  position: absolute; left: 8px; top: -60px; z-index: 90;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 8px 12px; text-decoration: none; transition: top .12s ease;
}
.skiplink:focus { top: 8px; }

.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--alt); flex: none; }
.dot.h-dea { background: var(--dea); }
.dot.h-osg { background: var(--osg); }

.cap { font-size: 12px; color: var(--muted); }
.stitle { font-family: var(--display); font-size: 19px; line-height: 1.15; color: var(--ink); }
.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ink-2); font-size: inherit; text-decoration: underline; text-underline-offset: 2px;
}
.linkbtn:hover { color: var(--ink); }

/* --------------------------------------------------------------------------
   3. Titolo, viste, ricerca
   -------------------------------------------------------------------------- */
.topbar { padding: 10px var(--pad) 0; }

.titlerow { display: flex; align-items: baseline; gap: 10px; }
.wordmark {
  font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.15;
  color: var(--ink-2); letter-spacing: .01em; white-space: nowrap;
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.month { margin-left: auto; display: flex; align-items: baseline; min-width: 0; }
.month__t { font-family: var(--display); font-size: 21px; line-height: 1.15; color: var(--ink); white-space: nowrap; }
.month__sel { position: relative; display: inline-flex; align-items: center; gap: 3px; }
.month__sel select {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; border: 0; padding: 0; margin: 0; -webkit-appearance: none; appearance: none;
}
.month__sel .ico { width: 14px; height: 14px; color: var(--muted); }
.month__sel:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

.segbar { display: flex; gap: 16px; padding: 8px 0 0; }
.seg {
  padding: 4px 0 6px; background: none; border: 0; border-bottom: 2px solid transparent;
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted);
}
.seg[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.seg:hover { color: var(--ink); }

.searchbar {
  position: sticky; top: 0; z-index: 40;
  padding: 6px var(--pad) 7px;
  border-bottom: 1px solid var(--line);
}

.search {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 8px 0 12px;
  background: transparent;
  border: 1px solid var(--line-strong); border-radius: 10px;
}
.search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.search__ico { width: 18px; height: 18px; color: var(--muted); }
.search__body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.search__input {
  flex: 1; min-width: 40px; width: 100%;
  border: 0; background: none; outline: none; padding: 0;
  font: 400 16px/1.3 var(--ui); color: var(--ink);
}
.search__input::placeholder { color: var(--muted); }

.pintoken {
  display: inline-flex; align-items: center; gap: 2px;
  max-width: 62%; padding: 3px 3px 3px 7px;
  background: var(--hl); color: var(--hl-ink); border-radius: 4px;
  font-size: 14px; font-weight: 600; letter-spacing: .01em;
}
.pintoken__n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pintoken button {
  display: grid; place-items: center; width: 24px; height: 24px;
  background: none; border: 0; border-radius: 4px; cursor: pointer; color: var(--hl-ink);
}
.pintoken button:hover { background: rgba(0, 0, 0, .12); }

.iconbtn {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  background: none; border: 0; border-radius: 8px; cursor: pointer; color: var(--muted);
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }

/* Elenco dei nomi sotto il campo */
.pop {
  position: absolute; top: calc(100% + 6px); left: -1px; right: -1px; z-index: 50;
  max-height: 50vh; overflow-y: auto; overscroll-behavior-y: none;
  background: var(--surface); border: 0; border-radius: 12px;
  box-shadow: var(--shadow); padding: 4px;
}
.opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 42px; padding: 6px 8px;
  background: none; border: 0; border-radius: 7px; cursor: pointer; text-align: left;
}
.opt + .opt { border-top: 1px solid var(--line); }
.opt.is-armed { background: var(--hl-soft); color: var(--hl-soft-ink); border-top-color: transparent; }
.opt__main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.opt__name { font-size: 14px; font-weight: 500; letter-spacing: .01em; overflow-wrap: break-word; }
.opt__name b { font-weight: 600; box-shadow: inset 0 -.55em 0 var(--hl-soft); }
.opt.is-armed .opt__name b { box-shadow: none; text-decoration: underline; text-underline-offset: 2px; }
.opt__why { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--sev2); }
.opt__why .ico { width: 12px; height: 12px; }
.opt__n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt__dots { display: flex; gap: 3px; }
.opt__empty { padding: 12px 10px; color: var(--muted); font-size: 13.5px; }

/* --------------------------------------------------------------------------
   4. Impaginato
   -------------------------------------------------------------------------- */
.page {
  padding: 12px var(--pad) calc(48px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 14px;
}
.view { display: flex; flex-direction: column; gap: 12px; }

.personline {
  font-size: 12.5px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; letter-spacing: .005em;
}
.personline .dot { display: inline-block; vertical-align: baseline; margin-right: 3px; }

/* --------------------------------------------------------------------------
   5. Calendario
   -------------------------------------------------------------------------- */
.cal { display: flex; flex-direction: column; gap: 4px; }
.cal__row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal__wd span { font-size: 10.5px; letter-spacing: .06em; color: var(--muted); padding: 0 0 1px 6px; }

.cal__d {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  min-height: 46px; padding: 3px 4px 4px;
  background: none; border: 1.5px solid transparent; border-radius: 7px;
  font: inherit; color: var(--ink-2); text-align: left; cursor: pointer;
  transition: background-color .15s ease, border-color .12s ease, transform .08s ease;
}
.cal__d:hover { background: var(--surface-2); }
.cal__d:active { transform: scale(.96); }
.cal__d.is-weekend { background: var(--weekend); }
.cal__d.is-sel { border-color: var(--ink); }
.cal__d.is-out { cursor: default; }
.cal__d.is-out .cal__n { color: var(--muted); opacity: .5; }

.cal__n {
  font-family: var(--mono); font-size: 12px; line-height: 15px;
  font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.cal__n.is-today {
  display: inline-grid; place-items: center; min-width: 19px; height: 19px; margin: -2px 0 -2px -3px;
  border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink);
}

.cal__chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chipslot {
  width: 14px; height: 14px; border-radius: 3px;
  display: grid; place-items: center;
  font-size: 9.5px; font-weight: 600; line-height: 1;
  background: var(--alt-tint); color: var(--alt);
}
/* La lettera vira verso l'inchiostro: resta leggibile su fondo tenue nei due temi. */
.chipslot.h-dea { background: var(--dea-tint); color: color-mix(in srgb, var(--dea) 75%, var(--ink)); }
.chipslot.h-osg { background: var(--osg-tint); color: color-mix(in srgb, var(--osg) 75%, var(--ink)); }
.chipslot.is-night.h-dea { background: var(--dea); color: var(--surface); }
.chipslot.is-night.h-osg { background: var(--osg); color: var(--surface); }
.chipslot.is-find { outline: 1px solid var(--fsev); outline-offset: 1px; }

.cal__dot { position: absolute; right: 4px; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--fsev); }

.sev-1 { --fsev: var(--sev1); }
.sev-2 { --fsev: var(--sev2); }
.sev-3 { --fsev: var(--sev3); }

.callegend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
  font-size: 11px; color: var(--muted);
}
.callegend span { display: inline-flex; align-items: center; gap: 4px; }
.callegend b { font-weight: 600; color: var(--ink-2); }

/* --------------------------------------------------------------------------
   6. Giorno scelto
   -------------------------------------------------------------------------- */
.detail {
  margin: 0 calc(var(--pad) * -1);          /* il fondo del weekend arriva ai bordi del foglio */
  padding: 4px var(--pad) 6px;
  border-top: 1px solid var(--line);
  scroll-margin-top: calc(var(--h-header) + 8px);
  touch-action: pan-y;
}
.detail.is-weekend { background: var(--weekend); }

.detail__hd { display: flex; align-items: center; gap: 4px; }
.detail__t { flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.detail__num { font-family: var(--display); font-size: 26px; line-height: 1.1; color: var(--ink); }
.detail__wd { font-size: 13.5px; color: var(--ink-2); }
.detail__oggi {
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.navday {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: 8px; color: var(--ink-2); cursor: pointer;
}
.navday:hover { background: var(--surface-2); color: var(--ink); }
.navday[disabled] { opacity: .35; cursor: default; }
.navday .ico { width: 18px; height: 18px; }

.detail__cols { display: grid; grid-template-columns: var(--tpl); gap: 0 8px; padding: 0 0 2px; }
.detail__h {
  display: flex; align-items: center; gap: 5px; padding-left: 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}

.detail__row { display: grid; grid-template-columns: var(--tpl); gap: 0 8px; padding: 3px 0; align-items: start; }
.detail__row:last-child { padding-bottom: 7px; }
.detail__row.is-night { background: var(--night-veil); margin: 0 calc(var(--pad) * -1); padding: 3px var(--pad); }
.detail__lab { padding-top: 3px; min-width: 0; font-size: 12px; color: var(--ink-2); }
.detail__lab time { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.detail__cell { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.dash { padding: 3px 0; color: var(--line-strong); font-size: 13px; }
.detail__none { padding: 6px 0 2px; font-size: 12.5px; color: var(--muted); }

.pill {
  position: relative;
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  padding: 3px 6px;
  background: none; border: 0; border-radius: 4px; cursor: pointer; text-align: left;
  font-size: 12.5px; font-weight: 500; line-height: 18px; letter-spacing: .01em;
  color: var(--ink); overflow-wrap: break-word;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease, transform .08s ease;
}
.pill::after { content: ""; position: absolute; inset: -5px -2px; }   /* area di tocco */
.pill:hover { background: var(--surface-2); }
.pill:active { transform: scale(.97); }
.pill.is-soft { background: var(--hl-soft); color: var(--hl-soft-ink); }
.pill.is-strong { background: var(--hl); color: var(--hl-ink); }
.pill .fdot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--fsev); }

.is-pinned .pill:not(.is-strong) { opacity: .45; }
.tab.is-pinned .pill:not(.is-strong) { opacity: .72; }   /* qui si legge tutti, non solo la persona */

@keyframes flashcell { from { background-color: var(--hl-soft); } }
.detail.is-flash, .tab tr.is-flash > * { animation: flashcell 1.2s ease-out; }

/* --------------------------------------------------------------------------
   7. Tabella del mese
   -------------------------------------------------------------------------- */
.tab {
  width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.tab th, .tab td { padding: 0; text-align: left; vertical-align: top; }

.tab thead th {
  position: sticky; top: calc(var(--h-header) - 1px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 5px 2px; font-weight: 400;
}
.tab__hs b { font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.tab__hs time { font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-left: 3px; }
.tab thead .is-night { background: var(--night-veil); }

.tab tbody tr { scroll-margin-top: calc(var(--h-header) + 34px); }
.tab tbody tr.is-weekend { background: var(--weekend); }
.tab__r--first > * { border-top: 1px solid var(--line); }
.tab__r--first:first-child > * { border-top: 0; }
.tab tbody tr > .is-night { background: var(--night-veil); }

.tab__day { padding: 3px 2px 3px 4px !important; scroll-margin-top: calc(var(--h-header) + 34px); }
.tab__daybtn {
  display: flex; flex-direction: column; align-items: flex-start;
  min-height: 34px; padding: 1px 2px; background: none; border: 0; border-radius: 5px;
  cursor: pointer; text-align: left;
}
.tab__daybtn:hover { background: var(--surface-2); }
.tab__daybtn .n {
  font-family: var(--mono); font-size: 14px; line-height: 16px; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.tab__daybtn .n.is-today {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: -2px;
  border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink);
}
.tab__daybtn .wd { font-size: 10px; line-height: 11px; color: var(--muted); }

.tab__h { padding: 4px 0 0 !important; }
.tab__h .dot { margin: 0 auto; }
.tab__c { padding: 2px 1px !important; overflow: hidden; }

.pill--t {
  display: flex; align-items: center; gap: 3px; width: 100%; max-width: 100%;
  padding: 0 1px; margin: 0; border-radius: 3px;
  font-size: var(--tabfs, 10px); font-weight: 500; line-height: 13px; letter-spacing: -.02em;
}
.pill--t > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill--t::after { inset: -3px -2px; }
.pill--t .fdot { width: 5px; height: 5px; }

/* --------------------------------------------------------------------------
   8. Ore
   -------------------------------------------------------------------------- */
.ore { display: flex; flex-direction: column; gap: 2px; }
.ore__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ore__legend { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.ore__legend span { display: inline-flex; align-items: center; gap: 4px; }

.ore__row {
  display: grid; grid-template-columns: minmax(96px, 30%) 1fr 40px;
  align-items: center; gap: 6px; min-height: 30px;
}
.ore__name {
  justify-self: start; max-width: 100%;
  padding: 3px 5px; border-radius: 4px;
  font-size: 12.5px; font-weight: 500; letter-spacing: .01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ore__bar { display: flex; align-items: center; height: 10px; min-width: 0; }
.ore__seg { display: block; height: 10px; flex: none; background: var(--alt); }
.ore__seg.h-dea { background: var(--dea); }
.ore__seg.h-osg { background: var(--osg); }
.ore__seg + .ore__seg { margin-left: 2px; }
.ore__seg:last-child { border-radius: 0 2px 2px 0; }
.ore__v { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------------------
   9. Segnalazioni
   -------------------------------------------------------------------------- */
.findings { border-top: 1px solid var(--line); padding-top: 12px; scroll-margin-top: calc(var(--h-header) + 8px); }
.findings__head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.fgroup { margin-top: 10px; }
.fgroup__t {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 4px;
}
.fitem {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; width: 100%;
  padding: 6px 0 6px 9px; margin-bottom: 2px;
  border-left: 3px solid var(--fsev); cursor: pointer;
}
.fitem__who {
  padding: 2px 5px; margin: 0 0 0 -5px;
  background: none; border: 0; border-radius: 4px; cursor: pointer;
  font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--ink);
}
.fitem__who.is-soft { background: var(--hl-soft); color: var(--hl-soft-ink); }
.fitem__who.is-strong { background: var(--hl); color: var(--hl-ink); }
.fitem__short {
  flex: 1; min-width: 0; padding: 2px 0; text-align: left;
  background: none; border: 0; cursor: pointer;
  font-size: 12.5px; color: var(--ink-2);
}
.fempty { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink-2); font-size: 13.5px; }
.fempty .ico { color: var(--ok); }

.legenda { margin-top: 8px; }
.legenda__t {
  display: flex; align-items: center; gap: 6px; min-height: 36px;
  font-size: 12px; color: var(--muted); cursor: pointer; list-style: none;
}
.legenda__t::-webkit-details-marker { display: none; }
.legenda__t .ico { width: 14px; height: 14px; transition: transform .15s ease; }
.legenda[open] .legenda__t .ico { transform: rotate(180deg); }
.legenda__row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
.legenda__mark { width: 3px; border-radius: 2px; flex: none; background: var(--fsev); margin: 2px 0; }
.legenda__row b { font-weight: 600; color: var(--ink); }

/* --------------------------------------------------------------------------
   10. Dati
   -------------------------------------------------------------------------- */
.dati { border-top: 1px solid var(--line); font-size: 12.5px; }
.dati__sum {
  display: flex; align-items: center; gap: 8px;
  min-height: 44px; cursor: pointer;
  font-weight: 500; color: var(--ink-2); list-style: none;
}
.dati__sum::-webkit-details-marker { display: none; }
.dati__chev { transition: transform .15s ease; color: var(--muted); }
.dati[open] .dati__chev { transform: rotate(180deg); }
.dati__body { padding: 0 0 12px; display: flex; flex-direction: column; gap: 12px; color: var(--ink-2); }
.dati__block { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.dati__block.is-off { opacity: .5; }
.dati__t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dati__row { display: flex; gap: 8px; flex-wrap: wrap; }
.dati__note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.src:first-of-type { border-top: 0; }
.src__file { font-family: var(--mono); font-size: 11.5px; color: var(--ink); overflow-wrap: anywhere; }
.src__meta { width: 100%; font-size: 11.5px; color: var(--muted); }
.badge {
  padding: 2px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
}
.badge.is-browser { color: var(--ink-2); border-color: var(--line-strong); }
.minibtn {
  min-height: 32px; padding: 0 10px;
  background: none; border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink-2); font-size: 12px; cursor: pointer;
}
.minibtn:hover { border-color: var(--line-strong); color: var(--ink); }
.warnrow { display: flex; gap: 6px; align-items: flex-start; font-size: 11.5px; color: var(--ink-2); }
.warnrow .ico { width: 13px; height: 13px; color: var(--sev2); margin-top: 2px; }

.switch { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch__track {
  position: relative; width: 36px; height: 22px; flex: none;
  background: var(--line-strong); border-radius: 11px; transition: background-color .16s ease;
}
.switch__track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  background: var(--surface); border-radius: 50%; transition: transform .16s ease;
}
.switch input:checked + .switch__track { background: var(--ink-2); }
.switch input:checked + .switch__track::after { transform: translateX(14px); }
.switch input:focus-visible + .switch__track { outline: 2px solid var(--focus); outline-offset: 2px; }

/* --------------------------------------------------------------------------
   11. Pulsanti, stato vuoto, foglio di revisione, avvisi
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: none;
  color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.btn--solid { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn--solid:hover { background: var(--ink-2); border-color: var(--ink-2); }

.empty { padding: 40px 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty__t { font-family: var(--display); font-size: 24px; }

/* Foglio di revisione delle modifiche di un file caricato */
.sheet { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet__scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet__panel:focus { outline: none; }
.sheet__panel {
  position: relative; z-index: 1; width: 100%; max-width: 640px; max-height: 86vh;
  display: flex; flex-direction: column; overscroll-behavior: contain;
  background: var(--surface); border-radius: 14px 14px 0 0; box-shadow: var(--shadow);
}
.sheet__head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet__t { font-family: var(--display); font-size: 19px; line-height: 1.2; color: var(--ink); }
.sheet__cap { margin-top: 3px; font-size: 12px; color: var(--muted); }
.sheet__body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 14px; }
.sheet__foot {
  display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
}
.sheet__foot .btn { flex: 1; }

.chg__day {
  display: flex; align-items: baseline; gap: 6px;
  margin: 12px -16px 2px; padding: 4px 16px;
  font-size: 12.5px; font-weight: 500; color: var(--ink);
}
.chg__day.is-weekend { background: var(--weekend); }
.chg {
  display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: baseline;
  margin: 0 -16px; padding: 5px 16px;
}
.chg.is-night { background: var(--night-veil); }
.chg__slot { font-size: 11px; color: var(--muted); }
.chg__val { font-size: 12.5px; color: var(--ink-2); overflow-wrap: break-word; }
.chg__old { color: var(--muted); text-decoration: line-through; }
.chg__new { color: var(--ink); font-weight: 600; }
.chg__add { color: var(--ok); font-weight: 600; }
.chg__del { color: var(--sev3); text-decoration: line-through; }
.chg__note { display: block; font-size: 11px; color: var(--muted); }
.chg__sum { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.chg__block { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }

.toasts {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 0 12px calc(14px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 8px;
  width: min(520px, 100%); padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-left: 3px solid var(--ok); border-radius: 8px;
  box-shadow: var(--shadow); font-size: 13px; color: var(--ink);
  animation: toastin .18s ease-out;
}
.toast.is-error { border-left-color: var(--sev3); }
.toast .ico { margin-top: 2px; color: var(--ok); }
.toast.is-error .ico { color: var(--sev3); }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

/* --------------------------------------------------------------------------
   12. Schermi larghi e telefoni stretti
   -------------------------------------------------------------------------- */
@media (min-width: 640px) {
  :root { --fs: 15px; --pad: 16px; --dlabel: 84px; --tabfs: 12px; }
  .wordmark, .month__t { font-size: 23px; }
  .cal__d { min-height: 58px; }
  .detail__num { font-size: 30px; }
  .stitle { font-size: 21px; }
  .pill { font-size: 13px; }
  .sheet { align-items: center; padding: 24px; }
  .sheet__panel { max-width: 520px; border-radius: 14px; max-height: 80vh; }
}

@media (max-width: 379px) {
  :root { --dlabel: 66px; --pad: 10px; }
  .wordmark, .month__t { font-size: 18px; }
  .segbar { gap: 12px; }
}

/* --------------------------------------------------------------------------
   13. Movimento ridotto
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .pill:active, .btn:active, .cal__d:active { transform: none; }
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

<script>
'use strict';

// parser.js -- xlsx (zero dependencies) -> Roster
// Works both as a classic <script> in the browser (window.TurniParser) and
// as a CommonJS module in Node 22 (module.exports). See README.md / SPEC for
// the exact data model and parsing rules this file implements.

const TurniParser = (function () {

  // ============================================================
  // Phase 0: small generic helpers (strings, refs, dates)
  // ============================================================

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function collapseWs(s) {
    return s.replace(/\s+/g, ' ').trim();
  }

  function stripAccents(s) {
    // Strip Unicode combining marks (range U+0300-U+036F) left behind by NFD
    // normalization, e.g. "e" + combining acute -> "e". Written via numeric
    // code points (rather than a \uXXXX-\uXXXX regex range) to keep the
    // source file free of raw combining characters.
    const COMBINING_LO = 0x0300;
    const COMBINING_HI = 0x036f;
    let out = '';
    const decomposed = s.normalize('NFD');
    for (let i = 0; i < decomposed.length; i++) {
      const code = decomposed.charCodeAt(i);
      if (code < COMBINING_LO || code > COMBINING_HI) out += decomposed.charAt(i);
    }
    return out;
  }

  function basename(p) {
    const parts = String(p).split(/[\\/]/);
    return parts[parts.length - 1];
  }

  // "AB12" -> "AB"
  function colLetters(ref) {
    const m = /^[A-Za-z]+/.exec(ref);
    return m ? m[0].toUpperCase() : '';
  }

  // "AB12" -> 12
  function rowNum(ref) {
    const m = /\d+/.exec(ref);
    return m ? parseInt(m[0], 10) : NaN;
  }

  // "A" -> 1, "Z" -> 26, "AA" -> 27, "AB" -> 28
  function colIndex(letters) {
    const s = letters.toUpperCase();
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      n = n * 26 + (s.charCodeAt(i) - 64);
    }
    return n;
  }

  function toUint8Array(bytes) {
    if (bytes instanceof Uint8Array) return bytes;
    if (bytes instanceof ArrayBuffer) return new Uint8Array(bytes);
    throw new Error('parseWorkbook: bytes must be a Uint8Array or ArrayBuffer');
  }

  function utf8Decode(u8) {
    return new TextDecoder('utf-8').decode(u8);
  }

  // ============================================================
  // Phase 1: XML entity / attribute helpers
  // ============================================================

  const ENTITY_RE = /&(#x[0-9a-fA-F]+|#[0-9]+|amp|lt|gt|quot|apos);/g;

  function decodeEntities(s) {
    if (s.indexOf('&') === -1) return s;
    return s.replace(ENTITY_RE, function (whole, ent) {
      if (ent.charAt(0) === '#') {
        const isHex = ent.charAt(1) === 'x' || ent.charAt(1) === 'X';
        const code = isHex ? parseInt(ent.slice(2), 16) : parseInt(ent.slice(1), 10);
        return String.fromCodePoint(code);
      }
      switch (ent) {
        case 'amp': return '&';
        case 'lt': return '<';
        case 'gt': return '>';
        case 'quot': return '"';
        case 'apos': return '\'';
        default: return whole;
      }
    });
  }

  // Generic attribute-string ("a=\"1\" b='2'") -> {a:"1", b:"2"}. Order-independent.
  function parseAttrs(attrStr) {
    const attrs = {};
    if (!attrStr) return attrs;
    const re = /([a-zA-Z_:][-a-zA-Z0-9_:.]*)\s*=\s*"([^"]*)"|([a-zA-Z_:][-a-zA-Z0-9_:.]*)\s*=\s*'([^']*)'/g;
    let m;
    while ((m = re.exec(attrStr))) {
      if (m[1] !== undefined) attrs[m[1]] = decodeEntities(m[2]);
      else attrs[m[3]] = decodeEntities(m[4]);
    }
    return attrs;
  }

  // First occurrence of <tag>content</tag> or <tag/> inside `content`.
  // Returns the inner text, or null if the tag is absent entirely.
  function firstTag(content, tag) {
    const re = new RegExp('<' + tag + '\\b[^>]*\\/>|<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>');
    const m = re.exec(content);
    if (!m) return null;
    return m[1] !== undefined ? m[1] : '';
  }

  // Concatenation of every <tag>...</tag> (or self-closing) occurrence inside `content`.
  function allTagText(content, tag) {
    const re = new RegExp('<' + tag + '\\b[^>]*\\/>|<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>', 'g');
    let out = '';
    let m;
    while ((m = re.exec(content))) {
      out += m[1] !== undefined ? m[1] : '';
    }
    return out;
  }

  function extractIs(cellInner) {
    const m = /<is\b[^>]*\/>|<is\b[^>]*>([\s\S]*?)<\/is>/.exec(cellInner);
    if (!m) return cellInner;
    return m[1] !== undefined ? m[1] : '';
  }

  // ============================================================
  // Phase 2: ZIP reading (no dependencies)
  // ============================================================

  const EOCD_SIG = 0x06054b50;
  const CEN_SIG = 0x02014b50;
  const LOC_SIG = 0x04034b50;

  async function readZip(bytes) {
    const u8 = toUint8Array(bytes);
    if (u8.length < 22) throw new Error('File ZIP non valido: troppo piccolo');
    const view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    // find End Of Central Directory scanning backwards (comment can be up to 65535 bytes)
    const maxBack = Math.min(u8.length, 22 + 65535);
    let eocd = -1;
    for (let i = u8.length - 22; i >= u8.length - maxBack; i--) {
      if (i < 0) break;
      if (view.getUint32(i, true) === EOCD_SIG) { eocd = i; break; }
    }
    if (eocd === -1) throw new Error('File ZIP non valido: End Of Central Directory non trovato');

    const totalEntries = view.getUint16(eocd + 10, true);
    let off = view.getUint32(eocd + 16, true);

    const entries = new Map();
    for (let i = 0; i < totalEntries; i++) {
      if (view.getUint32(off, true) !== CEN_SIG) {
        throw new Error('File ZIP non valido: central directory malformata');
      }
      const method = view.getUint16(off + 10, true);
      const compSize = view.getUint32(off + 20, true);
      const nameLen = view.getUint16(off + 28, true);
      const extraLen = view.getUint16(off + 30, true);
      const commentLen = view.getUint16(off + 32, true);
      const localOffset = view.getUint32(off + 42, true);
      const name = utf8Decode(u8.subarray(off + 46, off + 46 + nameLen));
      off += 46 + nameLen + extraLen + commentLen;

      if (name.charAt(name.length - 1) === '/') continue; // directory entry, no data

      if (view.getUint32(localOffset, true) !== LOC_SIG) {
        throw new Error('File ZIP non valido: local header malformato per ' + name);
      }
      const localNameLen = view.getUint16(localOffset + 26, true);
      const localExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + localNameLen + localExtraLen;
      const compData = u8.subarray(dataStart, dataStart + compSize);

      let data;
      if (method === 0) {
        data = compData.slice();
      } else if (method === 8) {
        data = await inflateRaw(compData);
      } else {
        throw new Error('Metodo di compressione ZIP non supportato (' + method + ') per ' + name);
      }
      entries.set(name, data);
    }
    return entries;
  }

  // Raw DEFLATE inflate, kept isolated: Node uses zlib, the browser uses
  // DecompressionStream('deflate-raw') (both act on headerless deflate streams).
  async function inflateRaw(u8) {
    const isNode = typeof process !== 'undefined' && process.versions && process.versions.node;
    if (isNode) {
      const zlib = require('zlib');
      return new Uint8Array(zlib.inflateRawSync(u8));
    }
    const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  // ============================================================
  // Phase 3: shared strings + sheet cell extraction
  // ============================================================

  function parseSharedStrings(xml) {
    if (!xml) return [];
    const out = [];
    const re = /<si\b[^>]*\/>|<si\b[^>]*>([\s\S]*?)<\/si>/g;
    let m;
    while ((m = re.exec(xml))) {
      const content = m[1] !== undefined ? m[1] : '';
      out.push(decodeEntities(allTagText(content, 't')));
    }
    return out;
  }

  function cellTextFromInner(type, inner, sharedStrings) {
    if (type === 's') {
      const v = firstTag(inner, 'v');
      if (v === null) return '';
      const idx = parseInt(v, 10);
      return sharedStrings[idx] !== undefined ? sharedStrings[idx] : '';
    }
    if (type === 'inlineStr') {
      return decodeEntities(allTagText(extractIs(inner), 't'));
    }
    if (type === 'str') {
      const v = firstTag(inner, 'v');
      return v === null ? '' : decodeEntities(v);
    }
    if (type === 'b') {
      const v = firstTag(inner, 'v');
      if (v === '1') return 'TRUE';
      if (v === '0') return 'FALSE';
      return '';
    }
    if (type === 'e') {
      return '';
    }
    // absent or "n": plain number, kept as its literal text
    const v = firstTag(inner, 'v');
    return v === null ? '' : decodeEntities(v);
  }

  // Iterates every <c ...>...</c> / <c .../> in a worksheet XML string.
  // Returns Map<ref, text> containing only non-empty cells.
  function parseSheetCells(sheetXml, sharedStrings) {
    const strings = sharedStrings || [];
    const cells = new Map();
    const re = /<c\b([^>]*)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g;
    let m;
    while ((m = re.exec(sheetXml))) {
      const attrStr = m[1] !== undefined ? m[1] : m[2];
      const inner = m[3] || '';
      const attrs = parseAttrs(attrStr);
      if (!attrs.r) continue;
      const text = cellTextFromInner(attrs.t, inner, strings);
      if (text !== '') cells.set(attrs.r, text);
    }
    return cells;
  }

  // ============================================================
  // Phase 4: names (splitting / normalizing)
  // ============================================================

  function normalizeName(s) {
    return s
      .replace(/[’‘`]/g, '\'')
      .replace(/\s+/g, ' ')
      .trim()
      .toLocaleUpperCase('it-IT');
  }

  function splitNames(raw) {
    if (!raw) return [];
    return raw
      .split(/[\/,;+&\n]/)
      .map(normalizeName)
      .filter(function (x) { return x.length > 0; });
  }

  // ============================================================
  // Phase 5: time ranges, months, weekdays
  // ============================================================

  const TIME_RANGE_RE = /(\d{1,2})(?:[.:,](\d{2}))?\s*[-–—]\s*(\d{1,2})(?:[.:,](\d{2}))?/;

  function parseTimeRange(headerText) {
    const m = TIME_RANGE_RE.exec(headerText);
    if (!m) return null;
    const sh = parseInt(m[1], 10);
    const sm = m[2] ? parseInt(m[2], 10) : 0;
    const eh = parseInt(m[3], 10);
    const em = m[4] ? parseInt(m[4], 10) : 0;
    const startMin = sh * 60 + sm;
    let endMin = eh * 60 + em;
    if (endMin <= startMin) endMin += 1440;
    const label = collapseWs(headerText.slice(0, m.index) + headerText.slice(m.index + m[0].length));
    return {
      label: label,
      start: pad2(sh) + ':' + pad2(sm),
      end: pad2(eh) + ':' + pad2(em),
      startMin: startMin,
      endMin: endMin
    };
  }

  const MONTHS_IT = ['GENNAIO', 'FEBBRAIO', 'MARZO', 'APRILE', 'MAGGIO', 'GIUGNO',
    'LUGLIO', 'AGOSTO', 'SETTEMBRE', 'OTTOBRE', 'NOVEMBRE', 'DICEMBRE'];

  // Accepts "<mese> <anno>" with any separator (space, underscore, ...) between
  // the month word and the year, so it also works directly against filenames
  // like "TURNI_PS_DEA_SETTEMBRE_2026.xlsx".
  function monthFromLabel(label) {
    if (!label) return null;
    const re = /([A-Za-zÀ-ÿ]+)[^A-Za-zÀ-ÿ0-9]*(\d{4})/;
    const m = re.exec(label);
    if (!m) return null;
    const prefix = stripAccents(m[1]).toUpperCase().slice(0, 3);
    const idx = MONTHS_IT.findIndex(function (mo) { return mo.slice(0, 3) === prefix; });
    if (idx === -1) return null;
    return m[2] + '-' + pad2(idx + 1);
  }

  const WEEKDAYS_IT = ['LUNEDI', 'MARTEDI', 'MERCOLEDI', 'GIOVEDI', 'VENERDI', 'SABATO', 'DOMENICA'];
  // indexed by Date#getUTCDay() (0 = Sunday)
  const WEEKDAY_BY_JSDAY = ['DOMENICA', 'LUNEDI', 'MARTEDI', 'MERCOLEDI', 'GIOVEDI', 'VENERDI', 'SABATO'];

  function normalizeWeekday(s) {
    if (s == null) return '';
    return stripAccents(String(s))
      .replace(/['’`]/g, '')
      .toUpperCase()
      .trim();
  }

  function daysInMonth(year, month1based) {
    return new Date(Date.UTC(year, month1based, 0)).getUTCDate();
  }

  // ============================================================
  // Phase 6: workbook.xml / rels (sheet list + sheet-id -> file resolution)
  // ============================================================

  function parseWorkbookSheets(xml) {
    const out = [];
    const re = /<sheet\b([^>]*)\/>|<sheet\b([^>]*)>[\s\S]*?<\/sheet>/g;
    let m;
    while ((m = re.exec(xml))) {
      const attrStr = m[1] !== undefined ? m[1] : m[2];
      const attrs = parseAttrs(attrStr);
      out.push({ name: attrs.name, rId: attrs['r:id'] });
    }
    return out;
  }

  function parseRels(xml) {
    const map = {};
    const re = /<Relationship\b([^>]*)\/>|<Relationship\b([^>]*)>[\s\S]*?<\/Relationship>/g;
    let m;
    while ((m = re.exec(xml))) {
      const attrStr = m[1] !== undefined ? m[1] : m[2];
      const attrs = parseAttrs(attrStr);
      if (attrs.Id) map[attrs.Id] = attrs.Target;
    }
    return map;
  }

  // "worksheets/sheet1.xml" -> "xl/worksheets/sheet1.xml"; "/xl/worksheets/sheet1.xml" -> "xl/worksheets/sheet1.xml"
  function resolveTarget(target) {
    if (target.charAt(0) === '/') return target.slice(1);
    return 'xl/' + target;
  }

  // ============================================================
  // Phase 7: generic cell-map lookups shared by title/period/day scanning
  // ============================================================

  // First cell (reading order: row asc, then column asc) matching `predicate(text, ref)`.
  function findFirstMatch(cellsMap, predicate) {
    let best = null;
    for (const entry of cellsMap) {
      const ref = entry[0];
      const text = entry[1];
      if (!predicate(text, ref)) continue;
      const r = rowNum(ref);
      const c = colIndex(colLetters(ref));
      if (!best || r < best.r || (r === best.r && c < best.c)) {
        best = { ref: ref, text: text, r: r, c: c };
      }
    }
    return best;
  }

  function startsWithCI(text, prefix) {
    return text.trim().toUpperCase().indexOf(prefix) === 0;
  }

  // ============================================================
  // Phase 8: main entry point -- xlsx bytes -> Roster
  // ============================================================

  async function parseWorkbook(bytes, filename) {
    const file = basename(filename);
    const warnings = [];

    // --- read the zip + the workbook-level XML parts ---
    const entries = await readZip(bytes);
    function readEntry(name) {
      const data = entries.get(name);
      return data ? utf8Decode(data) : null;
    }
    const workbookXml = readEntry('xl/workbook.xml');
    if (!workbookXml) throw new Error('xl/workbook.xml non trovato in ' + file);
    const sheetDefs = parseWorkbookSheets(workbookXml);
    const rels = parseRels(readEntry('xl/_rels/workbook.xml.rels') || '');
    const sharedStrings = parseSharedStrings(readEntry('xl/sharedStrings.xml') || '');

    // --- find the first sheet (in workbook order) with a "MATTINA..." header cell ---
    let sheetName = null;
    let cells = null;
    let headerRef = null;
    for (const sd of sheetDefs) {
      const target = sd.rId && rels[sd.rId];
      if (!target) continue;
      const sheetXml = readEntry(resolveTarget(target));
      if (sheetXml === null) continue;
      const sheetCells = parseSheetCells(sheetXml, sharedStrings);
      const hit = findFirstMatch(sheetCells, function (text) { return startsWithCI(text, 'MATTINA'); });
      if (hit) {
        sheetName = sd.name;
        cells = sheetCells;
        headerRef = hit.ref;
        break;
      }
    }
    if (!cells) throw new Error('Foglio con intestazione "MATTINA" non trovato in ' + file);
    const headerRow = rowNum(headerRef);

    // --- slot columns on the header row ---
    const slots = buildSlots(cells, headerRow, warnings, file);

    // sub-header row -> roles
    const subRow = headerRow + 1;
    for (const slot of slots) {
      const subText = (cells.get(slot.col + subRow) || '').trim();
      slot.sub = subText;
      slot.roles = subText
        ? subText.split('/').map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 0; })
        : [];
    }

    // --- title / hospital ---
    const title = findTitle(cells, headerRow);
    const hospital = deriveHospital(title, file);

    // --- period / month ---
    const period = findPeriod(cells, file, warnings);

    // --- day rows ---
    const days = buildDays(cells, headerRow, slots, period.month, warnings);

    return {
      file: file,
      sheet: sheetName,
      hospital: hospital,
      title: title,
      periodLabel: period.periodLabel,
      month: period.month,
      slots: slots,
      days: days,
      warnings: warnings
    };
  }

  // ---- helpers used by parseWorkbook (kept separate for readability) ----

  const SLOT_DEFAULTS = {
    M: { start: '08:00', end: '14:00', startMin: 480, endMin: 840 },
    P: { start: '14:00', end: '20:00', startMin: 840, endMin: 1200 },
    N: { start: '20:00', end: '08:00', startMin: 1200, endMin: 1920 },
    A: { start: '09:30', end: '15:00', startMin: 570, endMin: 900 }
  };

  function buildSlots(cells, headerRow, warnings, file) {
    const headerCells = [];
    for (const entry of cells) {
      const ref = entry[0];
      if (rowNum(ref) === headerRow) {
        headerCells.push({ ref: ref, text: entry[1], col: colLetters(ref), ci: colIndex(colLetters(ref)) });
      }
    }
    headerCells.sort(function (a, b) { return a.ci - b.ci; });

    const slots = [];
    let unknownCount = 0;
    for (const hc of headerCells) {
      const header = hc.text.trim();
      const up = header.toUpperCase();
      let key = null;
      if (up.indexOf('MATTINA') !== -1) key = 'M';
      else if (up.indexOf('POMERIGGIO') !== -1) key = 'P';
      else if (up.indexOf('NOTTE') !== -1) key = 'N';
      else if (up.indexOf('AMBULATORIO') !== -1) key = 'A';

      const range = parseTimeRange(header);
      if (key === null && !range) continue; // not a slot column at all

      if (key === null) {
        unknownCount++;
        key = 'X' + unknownCount;
      }

      let label, start, end, startMin, endMin;
      if (range) {
        label = range.label;
        start = range.start; end = range.end;
        startMin = range.startMin; endMin = range.endMin;
      } else if (SLOT_DEFAULTS[key]) {
        const d = SLOT_DEFAULTS[key];
        label = collapseWs(header);
        start = d.start; end = d.end; startMin = d.startMin; endMin = d.endMin;
        warnings.push({
          type: 'slot-default-time',
          message: 'Nessun orario nell\'intestazione "' + header + '", uso orario predefinito ' + start + '-' + end,
          row: headerRow
        });
      } else {
        throw new Error('Intestazione turno senza orario riconoscibile: "' + header + '" in ' + file);
      }

      slots.push({
        key: key, label: label, header: header, sub: '', roles: [],
        start: start, end: end, startMin: startMin, endMin: endMin, col: hc.col
      });
    }
    if (slots.length === 0) throw new Error('Nessuna colonna turno trovata in ' + file);
    return slots;
  }

  function findTitle(cells, headerRow) {
    const turniHit = findFirstMatch(cells, function (text, ref) {
      return rowNum(ref) < headerRow && startsWithCI(text, 'TURNI');
    });
    if (turniHit) return turniHit.text.trim();
    const anyHit = findFirstMatch(cells, function (text, ref) { return rowNum(ref) < headerRow; });
    return anyHit ? anyHit.text.trim() : '';
  }

  function deriveHospital(title, file) {
    const titleUp = title.toUpperCase();
    let hospital;
    if (titleUp.indexOf('OSG') !== -1) hospital = 'OSG';
    else if (titleUp.indexOf('DEA') !== -1) hospital = 'DEA';
    else hospital = collapseWs(title.replace(/TURNI/gi, '').replace(/PS/gi, ''));

    if (!hospital) {
      const fileUp = file.toUpperCase();
      if (fileUp.indexOf('OSG') !== -1) hospital = 'OSG';
      else if (fileUp.indexOf('DEA') !== -1) hospital = 'DEA';
      else hospital = '?';
    }
    return hospital;
  }

  function findPeriod(cells, file, warnings) {
    let periodLabel = '';
    const periodoHit = findFirstMatch(cells, function (text) { return startsWithCI(text, 'PERIODO'); });
    if (periodoHit) {
      const pr = periodoHit.r;
      const pc = periodoHit.c;
      const rightHit = findFirstMatch(cells, function (text, ref) {
        return rowNum(ref) === pr && colIndex(colLetters(ref)) > pc;
      });
      if (rightHit) periodLabel = rightHit.text.trim();
    }

    let month = periodLabel ? monthFromLabel(periodLabel) : null;
    if (!month) {
      const fromFile = monthFromLabel(file);
      if (fromFile) {
        month = fromFile;
        warnings.push({ type: 'period-from-filename', message: 'Periodo dedotto dal nome del file ' + file });
      }
    }
    if (!month) throw new Error('Periodo di riferimento non trovato in ' + file);

    return { periodLabel: periodLabel, month: month };
  }

  function buildDays(cells, headerRow, slots, month, warnings) {
    const year = parseInt(month.slice(0, 4), 10);
    const monthNum = parseInt(month.slice(5, 7), 10);
    const ndays = daysInMonth(year, monthNum);
    const subHeaderRow = headerRow + 1;

    const candidates = [];
    for (const entry of cells) {
      const ref = entry[0];
      if (colLetters(ref) !== 'A') continue;
      const r = rowNum(ref);
      if (r <= subHeaderRow) continue;
      const t = entry[1].trim();
      if (!/^\d{1,2}$/.test(t)) continue;
      const d = parseInt(t, 10);
      if (d < 1 || d > 31) continue;
      candidates.push({ row: r, day: d });
    }
    candidates.sort(function (a, b) { return a.row - b.row; });

    const days = [];
    const seen = new Set();
    for (const cand of candidates) {
      const d = cand.day;
      const r = cand.row;

      if (d > ndays) {
        warnings.push({ type: 'day-out-of-range', message: 'Giorno ' + d + ' oltre la fine del mese', row: r, day: d });
        continue;
      }
      if (seen.has(d)) {
        warnings.push({ type: 'day-duplicate', message: 'Giorno ' + d + ' duplicato', row: r, day: d });
        continue;
      }
      seen.add(d);

      const weekdayLabel = (cells.get('B' + r) || '').trim();
      const expected = WEEKDAY_BY_JSDAY[new Date(Date.UTC(year, monthNum - 1, d)).getUTCDay()];
      const weekdayOk = normalizeWeekday(weekdayLabel) === expected;
      if (!weekdayOk) {
        warnings.push({
          type: 'weekday-mismatch',
          message: 'Giorno ' + d + ': etichetta "' + (weekdayLabel || '(vuoto)') + '", atteso ' + expected,
          row: r,
          day: d
        });
      }

      const dayCells = {};
      for (const slot of slots) {
        const raw = (cells.get(slot.col + r) || '').trim();
        dayCells[slot.key] = { raw: raw, names: splitNames(raw) };
      }

      days.push({
        day: d,
        date: month + '-' + pad2(d),
        weekdayLabel: weekdayLabel,
        weekdayOk: weekdayOk,
        cells: dayCells
      });
    }
    days.sort(function (a, b) { return a.day - b.day; });
    return days;
  }

  // ============================================================
  // Public API
  // ============================================================

  return {
    parseWorkbook: parseWorkbook,
    readZip: readZip,
    parseSheetCells: parseSheetCells,
    parseSharedStrings: parseSharedStrings,
    decodeEntities: decodeEntities,
    normalizeName: normalizeName,
    splitNames: splitNames,
    parseTimeRange: parseTimeRange,
    monthFromLabel: monthFromLabel,
    normalizeWeekday: normalizeWeekday,
    colLetters: colLetters,
    rowNum: rowNum,
    colIndex: colIndex,
    inflateRaw: inflateRaw
  };

})();

if (typeof module !== 'undefined' && module.exports) module.exports = TurniParser; else window.TurniParser = TurniParser;
